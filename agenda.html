<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16285a">
<title>Gerencia M Clean</title>
<link rel="manifest" href="manifest-gerencia.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gerencia M Clean">
<link rel="icon" href="icon-ger-192.png">
<link rel="apple-touch-icon" href="icon-ger-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#16285a;--navy2:#0f1d44;--yel:#f6d046;--blue:#2c66b8;--bg:#f3f5fa;--line:#e3e8f2;--txt:#1b2540;--mut:#6b7590;--ok:#1f9d63;--warn:#e2a400}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
button,select,input{font-family:inherit}
header{background:var(--navy);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.hrow{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.hrow img{height:34px;background:#fff;border-radius:10px;padding:3px 6px}
.htit{flex:1}.htit b{display:block;font-size:16px;font-weight:700}.htit small{font-size:11px;opacity:.75}
.ibtn{background:rgba(255,255,255,.12);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:14px 14px 90px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav button{border:1px solid var(--line);background:#fff;border-radius:10px;height:36px;min-width:36px;padding:0 10px;font-weight:600;cursor:pointer;color:var(--navy)}
.rango{font-weight:700;font-size:15px;color:var(--navy);text-transform:capitalize;width:100%}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi b{font-size:22px;font-weight:800;color:var(--navy);display:block;line-height:1.1}
.kpi span{font-size:11px;color:var(--mut)}
.kpi.alerta b{color:#c0392b}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--txt);cursor:pointer;display:flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.filtros{display:flex;gap:8px;margin-bottom:12px}
.filtros select,.filtros input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;font-size:13px;color:var(--txt)}
.dia{margin-bottom:14px}
.dia h3{font-size:13px;font-weight:700;color:var(--navy);text-transform:capitalize;margin:0 2px 6px;display:flex;justify-content:space-between}
.dia h3 span{color:var(--mut);font-weight:500}
.dia.hoy h3{color:var(--blue)}
.dia.hoy h3::before{content:"HOY · ";color:var(--blue)}
.vacio{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--mut)}
.srv{background:#fff;border:1px solid var(--line);border-left:5px solid var(--c,#999);border-radius:14px;padding:10px 12px;margin-bottom:6px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.srv .h{font-weight:800;font-size:14px;color:var(--navy);min-width:62px}
.srv .b{flex:1;min-width:0}
.srv .t1{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv .t2{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.est{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;align-self:center}
.e1{background:#e6eefb;color:var(--blue)}.e2{background:#fff6d6;color:#9a7300}.e3{background:#e2f6ec;color:var(--ok)}.e4{background:#eceef3;color:var(--mut)}
.sint{color:#c0392b;font-weight:600}
.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mes .dn{font-size:11px;font-weight:700;color:var(--mut);text-align:center;padding:4px 0}
.cel{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:74px;padding:5px;cursor:pointer;overflow:hidden}
.cel.fuera{opacity:.4}
.cel.hoy{border:2px solid var(--blue)}
.cel .n{font-size:12px;font-weight:700;color:var(--navy)}
.cel .n em{float:right;font-style:normal;background:var(--navy);color:#fff;border-radius:999px;font-size:10px;padding:0 6px}
.pill{font-size:10px;line-height:1.35;border-radius:5px;padding:1px 4px;margin-top:2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mas{font-size:10px;color:var(--mut);margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(10,18,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.hoja{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 26px}
@media(min-width:700px){.modal{align-items:center}.hoja{border-radius:22px}}
.hoja h2{font-size:17px;color:var(--navy);margin-bottom:2px}
.hoja .sub{font-size:12px;color:var(--mut);margin-bottom:12px}
.fila{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.fila b{min-width:96px;color:var(--mut);font-weight:500}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acc a,.acc button{display:block;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:11px;font-weight:700;font-size:13px;cursor:pointer}
.a1{background:var(--navy);color:#fff}.a2{background:#25d366;color:#fff}.a3{background:var(--yel);color:var(--navy)}.a4{background:var(--bg);color:var(--navy)}
#login{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.caja{background:#fff;border-radius:24px;padding:26px 22px;width:100%;max-width:360px;text-align:center}
.caja img{height:56px;margin-bottom:10px}
.caja h1{font-size:19px;color:var(--navy)}
.caja p{font-size:13px;color:var(--mut);margin:4px 0 16px}
.caja input{width:100%;font-size:26px;letter-spacing:10px;text-align:center;border:2px solid var(--line);border-radius:14px;padding:12px;outline:none}
.caja input:focus{border-color:var(--blue)}
.caja button{width:100%;margin-top:12px;background:var(--yel);color:var(--navy);border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:800;cursor:pointer}
.err{color:#c0392b;font-size:12px;min-height:18px;margin-top:8px}
.cargando{text-align:center;color:var(--mut);font-size:13px;padding:30px}
.pie{font-size:11px;color:var(--mut);text-align:center;margin-top:16px}
@media(max-width:520px){.kpi b{font-size:18px}.kpi{padding:8px}.cel{min-height:56px}.pill{display:none}.cel .dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}.cel .dots i{width:7px;height:7px;border-radius:50%}}
@media(min-width:521px){.cel .dots{display:none}}
.fab{position:fixed;right:18px;bottom:20px;z-index:40;background:var(--yel);color:var(--navy);border:0;border-radius:18px;padding:14px 20px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(13,44,84,.35);cursor:pointer}
.frm label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 4px}
.frm input,.frm select,.frm textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--txt)}
.frm textarea{min-height:70px;resize:vertical}
.frm .dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.frm .falta{background:#fff6d6!important;border-color:#f6d046!important}
.frm .sec{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;font-weight:800;color:var(--navy)}
.frm details{background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:10px}
.frm summary{font-weight:700;font-size:13px;color:var(--navy);cursor:pointer}
.frm .chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px;color:var(--txt);font-weight:500}
.frm .chk input{width:auto}
.frm .prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.frm .prev img{width:70px;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.frm .err{color:#c0392b;font-size:13px;margin-top:10px;min-height:16px}
.okbox{background:#eaf8f0;border-radius:14px;padding:14px;font-size:14px;margin:10px 0}
.nov{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.nov button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:700;font-size:12px;color:var(--navy);cursor:pointer}
.alertas{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.alertas .al{flex:none;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--navy);cursor:pointer;display:flex;gap:6px;align-items:center}
.alertas .al b{font-size:16px}.alertas .al.rojo{background:#fdecea;border-color:#f3b8b0;color:#b0281a}
.nov.est button.on{background:var(--navy);color:#fff}
.caja .campo{font-size:15px;letter-spacing:0;text-align:left;padding:12px 14px;margin-top:10px}
.caja .lnk{background:none;color:var(--blue);font-size:13px;font-weight:600;padding:6px;margin-top:6px;text-decoration:underline}
.caja .nota{font-size:12px;color:var(--mut);margin:10px 0 0}
.avatar{width:38px;height:38px;border-radius:50%;border:2px solid var(--yel);background:#fff;color:var(--navy);font-weight:800;font-size:14px;cursor:pointer;overflow:hidden;padding:0;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.perfoto{width:96px;height:96px;border-radius:50%;margin:6px auto 4px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:var(--navy);overflow:hidden;border:3px solid var(--yel)}
.perfoto img{width:100%;height:100%;object-fit:cover}
.rolchip{display:inline-block;background:var(--bg);color:var(--navy);border-radius:10px;padding:3px 10px;font-size:12px;font-weight:700}
.lector #nuevoBtn,.lector #pagBtn,.lector .nov,.lector .sub:has(+ .nov),.lector .srv button.est,.lector .solo-admin{display:none!important}
.barras{display:flex;align-items:flex-end;gap:3px;height:74px;margin-top:6px}.barras i{flex:1;background:var(--yel);border-radius:3px 3px 0 0;min-width:4px}
</style>
</head>
<body>
<div id="login">
  <div class="caja">
    <img src="logo-dark.webp" alt="M Clean">
    <h1>Gerencia M Clean</h1>
    <div id="lgEntrar">
      <p>Entra con tu correo y tu clave</p>
      <input class="campo" id="lgCorreo" type="email" inputmode="email" autocomplete="username" placeholder="Correo">
      <input class="campo" id="lgClave" type="password" autocomplete="current-password" placeholder="Clave">
      <button id="entrar">Entrar</button>
      <button class="lnk" id="lgOlvido" type="button">¿Olvidaste tu clave? · Primera vez</button>
    </div>
    <div id="lgRecuperar" style="display:none">
      <p id="lgRecTxt">Te enviamos un código a tu correo para crear una clave nueva.</p>
      <input class="campo" id="rcCorreo" type="email" inputmode="email" autocomplete="username" placeholder="Correo">
      <button id="rcPedir">Enviarme el código</button>
      <div id="rcPaso2" style="display:none">
        <input class="campo" id="rcCodigo" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Código de 6 dígitos">
        <input class="campo" id="rcClave" type="password" autocomplete="new-password" placeholder="Clave nueva (8+ letras y números)">
        <input class="campo" id="rcClave2" type="password" autocomplete="new-password" placeholder="Repite la clave nueva">
        <button id="rcGuardar">Guardar clave y entrar</button>
      </div>
      <button class="lnk" id="rcVolver" type="button">← Volver a entrar</button>
    </div>
    <div class="err" id="perr"></div>
    <p class="nota">¿No tienes acceso? Escríbele a gerencia.</p>
  </div>
</div>

<header>
  <div class="hrow">
    <img src="logo-dark.webp" alt="M Clean">
    <div class="htit"><b>Gerencia M Clean</b><small id="act">Todos los tableros</small></div>
    <button class="ibtn" id="tecBtn" title="Técnicos y empresas aliadas">👷</button>
    <button class="ibtn" id="pagBtn" title="Pagos técnicos">💵</button>
    <button class="ibtn" id="metBtn" title="Métricas">📊</button>
    <button class="ibtn" id="recargar" title="Actualizar">⟳</button>
    <button class="avatar" id="perBtn" title="Mi perfil">·</button>
  </div>
</header>

<main>
  <div class="bar">
    <div class="seg"><button data-v="semana" class="on">Semana</button><button data-v="mes">Mes</button><button data-v="lista">Próximos</button></div>
    <div class="nav"><button id="prev">‹</button><button id="hoyb">Hoy</button><button id="next">›</button></div>
    <div class="rango" id="rango"></div>
  </div>
  <div class="alertas" id="alertas"></div>
  <div class="kpis">
    <div class="kpi"><b id="kHoy">–</b><span>Hoy</span></div>
    <div class="kpi"><b id="kMan">–</b><span>Mañana</span></div>
    <div class="kpi"><b id="kRango">–</b><span id="kRangoT">En la vista</span></div>
    <div class="kpi alerta" id="kSinBtn" style="cursor:pointer"><b id="kSin">–</b><span>Sin técnico · ver</span></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="filtros">
    <select id="fTec"><option value="">Todos los técnicos</option></select>
    <select id="fEst"><option value="">Todos los estados</option><option value="1">Próximo</option><option value="2">En proceso</option><option value="3">Terminado</option><option value="4">Pagado</option></select>
  </div>
  <div id="vista"><div class="cargando">Cargando…</div></div>
  <div class="pie">Datos de Trello · se actualizan cada 10 minutos</div>
</main>

<button class="fab" id="nuevoBtn">＋ Agendar servicio</button>
<div class="modal" id="modal"><div class="hoja" id="hoja"></div></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwmj3prBAsOb77b5QTqPoY673GXdsZhBn0ef_ZaqDuX-9xzFoMCJFAs3Nq2tOeFoz2N/exec';
const COLORES = {'Valle de Aburrá':'#2c66b8','Eje Cafetero':'#1f9d63','Barranquilla':'#e67e22','Cartagena':'#8e44ad','Santa Marta':'#16a5b8','Bucaramanga':'#c0392b','Córdoba':'#d4a017','Apartadó':'#5d6d7e','Quibdó':'#27ae60','Otras ciudades':'#16285a'};
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const S = { clave:'', vista:'semana', ref:new Date(), datos:[], tab:'', tec:'', est:'', rango:null };
const $ = id => document.getElementById(id);
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };

const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const lunes = d => { const x = new Date(d); const w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; };
const minutos = h => { const m = String(h||'').match(/(\d{1,2})(?::(\d{2}))?\s*([ap])?/i); if(!m) return 9999; let H=+m[1]; const M=+(m[2]||0); if(m[3]){const pm=/p/i.test(m[3]); if(pm&&H<12)H+=12; if(!pm&&H===12)H=0;} return H*60+M; };
const hora12 = h => { const t = minutos(h); if(t===9999) return '—'; let H=Math.floor(t/60), M=t%60; const ap = H>=12?'p. m.':'a. m.'; H = H%12||12; return H+(M?':'+String(M).padStart(2,'0'):'')+' '+ap; };
const estado = l => { const m = String(l).match(/^(\d)\./); return m ? m[1] : '1'; };
const ESTN = {'1':'Próximo','2':'En proceso','3':'Terminado','4':'Pagado'};
const color = t => COLORES[t] || '#7f8c8d';
const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tecnicoDe = x => x.tecnico || ((String(x.lista).match(/Técnico:\s*(.+)$/)||[])[1]||'');

function rangoVista(){
  if (S.vista==='semana'){ const a = lunes(S.ref); return [a, addD(a,6)]; }
  if (S.vista==='mes'){ const a = new Date(S.ref.getFullYear(), S.ref.getMonth(), 1); const b = new Date(S.ref.getFullYear(), S.ref.getMonth()+1, 0); return [lunes(a), addD(lunes(addD(b,7)),-1)]; }
  const h = new Date(); h.setHours(0,0,0,0); return [h, addD(h,30)];
}

async function cargar(){
  const [a,b] = rangoVista();
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const desde = ymd(a < hoy ? a : hoy), hasta = ymd(b > addD(hoy,1) ? b : addD(hoy,1));
  if (S.rango && S.rango[0] <= desde && S.rango[1] >= hasta) { pintar(); return; }
  const ck = 'mc_ag_' + desde + '_' + hasta; let pre = null; try { pre = JSON.parse(localStorage.getItem(ck) || 'null'); } catch (e) { }
    if (pre && pre.d) { S.datos = pre.d; llenarFiltros(); pintar(); alertas(); $('act').textContent = 'Actualizando…'; } else $('vista').innerHTML = '<div class="cargando">Cargando agenda…</div>';
  try {
    const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ accion:'agenda', clave:S.clave, desde:desde, hasta:hasta }) });
    const j = await r.json();
    if (!j.ok) { if (/sesi[oó]n vencida/i.test(j.error||'')) { salir(); $('perr').textContent = j.error; return; } throw new Error(j.error||'Error'); }
    S.datos = j.servicios || []; S.rango = [desde, hasta];
      try { Object.keys(localStorage).filter(k => k.indexOf('mc_ag_') === 0 && k !== ck).forEach(k => localStorage.removeItem(k)); localStorage.setItem(ck, JSON.stringify({ d: S.datos })); } catch (e) { }
    $('act').textContent = 'Actualizado ' + (j.actualizado || 'ahora');
    llenarFiltros(); pintar(); alertas();
    if (!OPC) opciones().then(() => pintar()).catch(() => {});
  } catch (e) { $('vista').innerHTML = '<div class="cargando">No se pudo cargar: ' + esc(e.message) + '<br><br><button class="chip" onclick="S.rango=null;cargar()">Reintentar</button></div>'; }
}

function llenarFiltros(){
  const tabs = Object.keys(COLORES).filter(t => S.datos.some(x=>x.tablero===t)).concat([...new Set(S.datos.map(x=>x.tablero))].filter(t=>!COLORES[t]));
  $('chips').innerHTML = '<button class="chip'+(S.tab?'':' on')+'" data-t="">Todas las ciudades</button>' + tabs.map(t=>'<button class="chip'+(S.tab===t?' on':'')+'" data-t="'+esc(t)+'"><i style="background:'+color(t)+'"></i>'+esc(t)+'</button>').join('');
  const tecs = [...new Set(S.datos.map(tecnicoDe).filter(Boolean))].sort();
  $('fTec').innerHTML = '<option value="">Todos los técnicos</option><option value="__sin">⚠ Sin técnico</option>' + tecs.map(t=>'<option'+(S.tec===t?' selected':'')+'>'+esc(t)+'</option>').join('');
  if (S.tec==='__sin') $('fTec').value='__sin';
}

function filtrados(){
  return S.datos.filter(x => (!S.tab || x.tablero===S.tab) && (!S.est || estado(x.lista)===S.est) && (!S.tec || (S.tec==='__sin' ? !tecnicoDe(x) : tecnicoDe(x)===S.tec)))
    .sort((a,b) => a.fecha.localeCompare(b.fecha) || minutos(a.hora)-minutos(b.hora));
}

function tarjeta(x, i){
  const e = estado(x.lista), t = tecnicoDe(x);
  return '<div class="srv" style="--c:'+color(x.tablero)+'" data-i="'+i+'"><div class="h">'+hora12(x.hora)+'</div><div class="b">'+
    '<div class="t1">'+esc(x.ciudad||x.tablero)+' · '+esc(x.tipo||'Servicio')+'</div>'+
    '<div class="t2">'+(x.exp?'Exp. '+esc(x.exp)+' · ':'')+(t?'Téc. '+esc(t)+(noRegistrado(t)?' <span class="sint" style="font-weight:600">· falta registrar</span>':''):'<span class="sint">Sin técnico</span>')+'</div></div>'+
    '<span class="est e'+e+'">'+ESTN[e]+'</span></div>';
}

let VIS = [];
function pintar(){
  const [a,b] = rangoVista(), hoy = ymd(new Date()), man = ymd(addD(new Date(),1));
  const L = filtrados(); VIS = L;
  const enR = L.filter(x => x.fecha >= ymd(a) && x.fecha <= ymd(b));
  $('kHoy').textContent = L.filter(x=>x.fecha===hoy).length;
  $('kMan').textContent = L.filter(x=>x.fecha===man).length;
  $('kRango').textContent = enR.length;
  $('kRangoT').textContent = S.vista==='semana'?'Esta semana':S.vista==='mes'?'En el mes':'Próx. 30 días';
  $('kSin').textContent = enR.filter(x=>!tecnicoDe(x) && estado(x.lista)==='1').length;
  const fmt = d => d.toLocaleDateString('es-CO',{day:'numeric',month:'short'});
  $('rango').textContent = S.vista==='mes' ? S.ref.toLocaleDateString('es-CO',{month:'long',year:'numeric'}) : fmt(a)+' – '+fmt(b)+' '+b.getFullYear();
  document.querySelector('.nav').style.visibility = S.vista==='lista' ? 'hidden' : 'visible';

  if (S.vista==='mes') {
    const mes = S.ref.getMonth(); let h = '<div class="mes">' + ['lun','mar','mié','jue','vie','sáb','dom'].map(d=>'<div class="dn">'+d+'</div>').join('');
    for (let d = new Date(a); d <= b; d = addD(d,1)) {
      const k = ymd(d), del = L.filter(x=>x.fecha===k);
      h += '<div class="cel'+(d.getMonth()!==mes?' fuera':'')+(k===hoy?' hoy':'')+'" data-d="'+k+'"><div class="n">'+d.getDate()+(del.length?'<em>'+del.length+'</em>':'')+'</div>'+
        del.slice(0,3).map(x=>'<div class="pill" style="background:'+color(x.tablero)+'">'+hora12(x.hora).replace(/ [ap]\. m\./,'')+' '+esc(x.ciudad||x.tablero)+'</div>').join('')+
        (del.length>3?'<div class="mas">+'+(del.length-3)+' más</div>':'')+
        '<div class="dots">'+del.slice(0,8).map(x=>'<i style="background:'+color(x.tablero)+'"></i>').join('')+'</div></div>';
    }
    $('vista').innerHTML = h + '</div>';
    return;
  }
  const dias = []; for (let d = new Date(a); d <= b; d = addD(d,1)) dias.push(ymd(d));
  let h = '';
  dias.forEach(k => {
    const del = L.filter(x=>x.fecha===k);
    if (S.vista==='lista' && !del.length) return;
    const d = parse(k);
    h += '<div class="dia'+(k===hoy?' hoy':'')+'"><h3>'+DIAS[d.getDay()]+' '+d.getDate()+' '+d.toLocaleDateString('es-CO',{month:'short'})+'<span>'+(del.length?del.length+' servicio'+(del.length>1?'s':''):'')+'</span></h3>'+
      (del.length ? del.map(x=>tarjeta(x, L.indexOf(x))).join('') : '<div class="vacio">Sin servicios</div>')+'</div>';
  });
  $('vista').innerHTML = h || '<div class="cargando">No hay servicios con estos filtros.</div>';
}

function detalle(x){
  const t = tecnicoDe(x), e = estado(x.lista), cel = String(x.cel||'').replace(/\D/g,''), i = VIS.indexOf(x), nr = t && noRegistrado(t);
  const filas = [['Fecha', parse(x.fecha).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'})+' · '+hora12(x.hora)],['Estado',ESTN[e]],['Expediente',x.exp],['Cliente',x.cliente],['Celular',x.cel],['Campaña',x.emp],['Servicio',x.tipo],['Detalle',x.detalle],['Dirección',x.dir],['Ciudad',x.ciudad],['Tablero',x.tablero],['Técnico',t ? t + (nr ? ' · ⚠ falta por registrar en la plataforma' : '') : '⚠ Sin asignar'],['Horario',x.horario],['Valor',x.valor?'$'+Number(x.valor).toLocaleString('es-CO'):''],['Observaciones',x.obs]]
    .filter(f=>f[1]).map(f=>'<div class="fila"><b>'+f[0]+'</b><span>'+esc(f[1])+'</span></div>').join('');
  const mapa = x.dir ? 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.dir+', '+(x.ciudad||'')+', Colombia') : '';
  let seg = '';
  if (x.oferta) {
    const paso = (ic, lab, v, extra) => '<div class="fila"><b>'+ic+' '+lab+'</b><span>'+(v ? esc(v)+(extra||'') : '<span style="color:var(--mut)">—</span>')+'</span></div>';
    seg = '<div class="sub" style="margin-top:14px;font-weight:700;color:var(--navy)">Seguimiento del técnico'+(x.aliado?' · '+esc(x.aliado):'')+'</div>'+
      (x.tarde ? '<div class="okbox" style="background:#fdecea;margin:6px 0">⏰ No ha registrado llegada 15 minutos después de la hora.</div>' : '')+
      (x.oferta==='Abierta' ? '<div class="okbox" style="background:#fff6e0;margin:6px 0">📣 Ofertado a los técnicos aliados; aún nadie lo acepta.</div>' : '')+
      paso('🚗','Salida',x.salida)+paso('📍','Llegada',x.llegada, x.dist!==''&&x.dist!=null ? ' · a '+x.dist+' m' : '')+paso('✅','Terminó',x.fin)+
      (x.ubic ? '<div class="fila"><b>🛰 Última ubicación</b><span><a href="https://www.google.com/maps/search/?api=1&query='+x.ubic.lat+','+x.ubic.lng+'" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700">Ver en el mapa</a> · '+esc(x.ubic.hora)+(x.ubic.fecha!==ymd(new Date())?' ('+esc(x.ubic.fecha)+')':'')+' · '+esc(x.ubic.evento==='punto'?'en camino':x.ubic.evento)+'</span></div>' : '');
  }
  if (x.noIngreso) seg = '<div class="okbox" style="background:#fdecea;margin-top:12px;color:#b0281a">🚫 <b>El técnico no pudo ingresar</b> · '+esc(x.noIngreso)+'<br><span style="font-size:12px">Reporta la novedad y reprograma la visita.</span></div>' + seg;
  seg += '<div class="sub" style="margin-top:14px;font-weight:700;color:var(--navy)">📡 Seguimiento del cliente</div>' +
    (S.u && S.u.lector ? '<div class="fila"><b>Enlace</b><span>'+(x.trk?'<a href="'+esc(x.trk)+'" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700">Abrir</a>':'—')+'</span></div>'
      : '<div class="frm" style="margin-top:4px"><input id="trkUrl" inputmode="url" placeholder="Pega el enlace de seguimiento del servicio" value="'+esc(x.trk||'')+'"><p style="font-size:12px;color:var(--mut);margin-top:4px">El técnico lo abre al tocar “Salgo hacia el servicio”.</p><div class="nov" style="margin-top:6px"><button onclick="guardarTrk('+i+')">💾 Guardar enlace</button>'+(x.trk?'<a href="'+esc(x.trk)+'" target="_blank" rel="noopener" style="text-decoration:none"><button type="button">Abrir</button></a>':'')+'</div></div>');
  const est = ['1','2','3','4'].map(n => '<button '+(n===e?'class="on" disabled':'')+' onclick="accionGer('+i+',\'estado\',\''+n+'\')">'+['','📅 Próximo','🔧 En proceso','✅ Terminado','💵 Pagado'][+n]+'</button>').join('');
  $('hoja').innerHTML = '<h2>'+esc(x.tipo||'Servicio')+'</h2><div class="sub" style="color:'+color(x.tablero)+'">● '+esc(x.ciudad||x.tablero)+'</div>'+filas+seg+
    '<div class="acc">'+(x.url?'<a class="a1" href="'+esc(x.url)+'" target="_blank" rel="noopener">Abrir en Trello</a>':'')+
    (cel?'<a class="a2" href="https://wa.me/'+(cel.length===10?'57':'')+cel+'" target="_blank" rel="noopener">WhatsApp cliente</a>':'')+
    (mapa?'<a class="a3" href="'+mapa+'" target="_blank" rel="noopener">Ver dirección</a>':'')+
    '<button class="a4" onclick="cerrar()">Cerrar</button></div>'+
    (nr ? '<div class="okbox" style="background:#fff6e0;margin-top:12px">⚠ <b>'+esc(t)+'</b> falta por registrarse en la plataforma: no recibe ofertas ni registra su llegada. <a href="https://wa.me/?text='+encodeURIComponent('Hola '+t+', regístrate como técnico aliado de M Clean para recibir tus servicios y tu carnet digital: https://mcleandesinfeccion.github.io/registro.html')+'" target="_blank" rel="noopener" style="color:#1f9d63;font-weight:700">Enviarle el enlace de registro</a></div>' : '')+
    '<div class="nov" style="margin-top:14px"><button onclick="editarServicio('+i+')">✏️ Editar servicio</button><button onclick="tecnicoForm('+i+')" style="background:var(--yel);border-color:var(--yel)">👷 Asignar u ofrecer técnico</button><button onclick="evidencias('+i+')" style="background:var(--navy);color:#fff;border-color:var(--navy)">📷 Cargar evidencias y cerrar</button></div>'+
    '<div class="sub" style="margin-top:14px;font-weight:700;color:var(--navy)">Estado en Trello</div><div class="nov est">'+est+'</div>'+
    '<div class="sub" style="margin-top:14px;font-weight:700;color:var(--navy)">Novedades</div><div class="nov">'+
    '<button onclick="novedad('+i+',\'retraso\')">⏱ Retraso</button><button onclick="novedad('+i+',\'reprogramar\')">📅 Reprogramar</button>'+
    '<button onclick="novedad('+i+',\'abierto\')">🟡 Dejar abierto</button><button onclick="novedad('+i+',\'fallido\')">🔴 Fallido</button>'+
    '<button onclick="novedad('+i+',\'cancelar\')">❌ Cancelar</button><button onclick="novedad('+i+',\'asignado\')">📨 Confirmar asignación</button></div>';
  $('modal').classList.add('on');
}
function verDia(k){
  const del = VIS.filter(x=>x.fecha===k), d = parse(k);
  $('hoja').innerHTML = '<h2 style="text-transform:capitalize">'+d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'})+'</h2><div class="sub">'+del.length+' servicio(s)</div>'+
    (del.length ? del.map(x=>tarjeta(x, VIS.indexOf(x))).join('') : '<div class="vacio">Sin servicios</div>')+'<div class="acc"><button class="a4" style="grid-column:1/3" onclick="cerrar()">Cerrar</button></div>';
  $('modal').classList.add('on');
}
function cerrar(){ $('modal').classList.remove('on'); }

document.addEventListener('click', ev => {
  const s = ev.target.closest('.srv'); if (s) { detalle(VIS[+s.dataset.i]); return; }
  const c = ev.target.closest('.cel'); if (c) { verDia(c.dataset.d); return; }
  const ch = ev.target.closest('.chip[data-t]'); if (ch) { S.tab = ch.dataset.t; llenarFiltros(); pintar(); return; }
  const v = ev.target.closest('.seg button'); if (v) { document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on', b===v)); S.vista = v.dataset.v; cargar(); }
});
$('modal').addEventListener('click', e => { if (e.target.id==='modal') cerrar(); });
$('prev').onclick = () => { S.ref = S.vista==='mes' ? new Date(S.ref.getFullYear(), S.ref.getMonth()-1, 1) : addD(S.ref,-7); cargar(); };
$('next').onclick = () => { S.ref = S.vista==='mes' ? new Date(S.ref.getFullYear(), S.ref.getMonth()+1, 1) : addD(S.ref,7); cargar(); };
$('hoyb').onclick = () => { S.ref = new Date(); cargar(); };
$('recargar').onclick = async () => { const b = $('recargar'); if (b.disabled) return; b.disabled = true; b.style.animation = 'spin 1s linear infinite'; $('act').textContent = 'Actualizando desde Trello…';
  try { await gapi({accion:'gerSincronizar'}); } catch (e) { toastG(e.message); }
  b.disabled = false; b.style.animation = ''; S.rango = null; cargar(); };
$('fTec').onchange = e => { S.tec = e.target.value; pintar(); };
$('fEst').onchange = e => { S.est = e.target.value; pintar(); };

async function api0(body){ const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) }); const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Error'); return j; }
function usuario(u){ S.u = u; document.body.classList.toggle('lector', !!u.lector);
  const b = $('perBtn'); b.textContent = ''; if (u.foto) { const im = document.createElement('img'); im.src = u.foto; im.alt = ''; b.appendChild(im); } else b.textContent = (u.nombre||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function sesion(j){ S.clave = j.token; store.set('mc_ger_tok', j.token); store.set('mc_ger_correo', j.usuario.correo); usuario(j.usuario); $('login').style.display='none'; $('perr').textContent=''; $('lgClave').value=''; S.rango=null; cargar(); }
function salir(){ const t = S.clave; if (t) fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({accion:'usrSalir', clave:t}) }).catch(()=>{});
  store.del('mc_ger_tok'); store.del('mc_agenda'); S.clave=''; S.u=null; S.rango=null; OPC=null; document.body.classList.remove('lector'); cerrar(); modoLogin('entrar'); $('login').style.display='flex'; }
function modoLogin(m){ $('lgEntrar').style.display = m==='entrar' ? '' : 'none'; $('lgRecuperar').style.display = m==='entrar' ? 'none' : ''; $('rcPaso2').style.display='none'; $('rcPedir').style.display=''; $('perr').textContent='';
  if (m!=='entrar') { $('rcCorreo').value = $('lgCorreo').value || store.get('mc_ger_correo') || ''; } }
const ocupado = (b, t) => { b.dataset.t = b.dataset.t || b.textContent; b.disabled = !!t; b.textContent = t || b.dataset.t; };
async function entrar(){ const c = $('lgCorreo').value.trim(), k = $('lgClave').value; if (!c || !k) { $('perr').textContent = 'Escribe tu correo y tu clave.'; return; }
  const b = $('entrar'); ocupado(b, 'Entrando…'); $('perr').textContent = '';
  try { sesion(await api0({accion:'usrEntrar', correo:c, clave:k})); } catch (e) { $('perr').textContent = e.message; } ocupado(b); }
$('entrar').onclick = entrar;
$('lgClave').addEventListener('keydown', e => { if (e.key==='Enter') entrar(); });
$('lgOlvido').onclick = () => modoLogin('recuperar');
$('rcVolver').onclick = () => modoLogin('entrar');
$('rcPedir').onclick = async () => { const c = $('rcCorreo').value.trim(); if (!c) { $('perr').textContent = 'Escribe tu correo.'; return; }
  const b = $('rcPedir'); ocupado(b, 'Enviando…'); $('perr').textContent = '';
  try { const j = await api0({accion:'usrCodigo', correo:c}); $('lgRecTxt').textContent = j.mensaje + ' Vence en 10 minutos.'; b.style.display='none'; $('rcPaso2').style.display=''; setTimeout(()=>$('rcCodigo').focus(), 100); }
  catch (e) { $('perr').textContent = e.message; } ocupado(b); };
$('rcGuardar').onclick = async () => { const k1 = $('rcClave').value, k2 = $('rcClave2').value;
  if (!/^\d{6}$/.test($('rcCodigo').value.trim())) { $('perr').textContent = 'Escribe el código de 6 dígitos.'; return; }
  if (k1.length < 8 || !/\d/.test(k1) || !/[a-zA-ZñÑ]/.test(k1)) { $('perr').textContent = 'La clave debe tener mínimo 8 caracteres, con letras y números.'; return; }
  if (k1 !== k2) { $('perr').textContent = 'Las dos claves no coinciden.'; return; }
  const b = $('rcGuardar'); ocupado(b, 'Guardando…'); $('perr').textContent = '';
  try { const j = await api0({accion:'usrRestablecer', correo:$('rcCorreo').value.trim(), codigo:$('rcCodigo').value.trim(), clave:k1}); $('rcClave').value=''; $('rcClave2').value=''; $('rcCodigo').value=''; sesion(j); }
  catch (e) { $('perr').textContent = e.message; } ocupado(b); };
$('lgCorreo').value = store.get('mc_ger_correo') || '';
store.del('mc_agenda');
const guardada = store.get('mc_ger_tok');
if (guardada) { S.clave = guardada; $('login').style.display='none';
  api0({accion:'usrPerfil', clave:guardada}).then(j => { usuario(j.usuario); cargar(); }).catch(e => { salir(); $('perr').textContent = e.message; }); }
else setTimeout(()=>$(store.get('mc_ger_correo') ? 'lgClave' : 'lgCorreo').focus(), 200);

/* ---------- Mi perfil ---------- */
function fotoPerfil(file){ return new Promise((res, rej) => { const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => { const z = 240, c = document.createElement('canvas'), m = Math.min(im.width, im.height); c.width = c.height = z;
    c.getContext('2d').drawImage(im, (im.width-m)/2, (im.height-m)/2, m, m, 0, 0, z, z); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8)); };
  im.onerror = () => rej(new Error('No se pudo leer la foto.')); im.src = url; }); }
function perfil(){ const u = S.u || {}; let foto = null, quitar = false;
  const ini = (u.nombre||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  $('hoja').innerHTML = '<h2>Mi perfil</h2><div style="text-align:center"><label class="perfoto" id="pfFoto" style="cursor:pointer">'+(u.foto?'<img src="'+esc(u.foto)+'">':esc(ini))+'<input type="file" id="pfArch" accept="image/*" style="display:none"></label>'+
    '<div style="font-size:12px;color:var(--mut)">Toca la foto para cambiarla'+(u.foto?' · <a href="#" id="pfQuitar" style="color:var(--blue)">quitar</a>':'')+'</div>'+
    '<div style="margin-top:8px"><span class="rolchip">'+esc(u.cargo||'')+' · '+(u.lector?'Solo consulta':'Administrador')+'</span></div><div style="font-size:12px;color:var(--mut);margin-top:6px">'+esc(u.correo||'')+'</div></div>'+
    '<form class="frm" id="pfF"><label>Nombre</label><input id="pfNom" value="'+esc(u.nombre||'')+'" autocomplete="name">'+
    '<label>Teléfono</label><input id="pfTel" inputmode="tel" value="'+esc(u.telefono||'')+'" autocomplete="tel">'+
    '<label>Dirección</label><input id="pfDir" value="'+esc(u.direccion||'')+'" autocomplete="street-address">'+
    '<details><summary>Cambiar mi clave</summary><label>Clave actual</label><input id="pfK0" type="password" autocomplete="current-password"><label>Clave nueva (8+ letras y números)</label><input id="pfK1" type="password" autocomplete="new-password"><label>Repite la clave nueva</label><input id="pfK2" type="password" autocomplete="new-password"><p style="font-size:12px;color:var(--mut);margin-top:6px">¿No recuerdas la actual? Sal y usa “¿Olvidaste tu clave?”.</p></details>'+
    '<div class="err" id="pfErr"></div><div class="acc"><button type="button" class="a4" onclick="cerrar()">Cerrar</button><button type="submit" class="a1" id="pfOk">Guardar</button><button type="button" class="a4" id="pfSalir" style="grid-column:1/3;color:#c0392b">Cerrar sesión</button></div></form>';
  $('modal').classList.add('on');
  $('pfArch').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { foto = await fotoPerfil(f); quitar = false; $('pfFoto').querySelectorAll('img').forEach(x=>x.remove()); $('pfFoto').firstChild && $('pfFoto').firstChild.nodeType===3 && $('pfFoto').firstChild.remove(); const im = document.createElement('img'); im.src = foto; $('pfFoto').prepend(im); } catch (z) { $('pfErr').textContent = z.message; } };
  if ($('pfQuitar')) $('pfQuitar').onclick = e => { e.preventDefault(); quitar = true; foto = null; $('pfFoto').querySelectorAll('img').forEach(x=>x.remove()); $('pfFoto').prepend(document.createTextNode(ini)); };
  $('pfSalir').onclick = salir;
  $('pfF').onsubmit = async ev => { ev.preventDefault(); const d = {accion:'usrPerfilGuardar', nombre:$('pfNom').value, telefono:$('pfTel').value, direccion:$('pfDir').value};
    if (foto) d.foto = foto; if (quitar) d.quitarFoto = true;
    const k0 = $('pfK0').value, k1 = $('pfK1').value, k2 = $('pfK2').value;
    if (k1 || k0) { if (k1.length < 8 || !/\d/.test(k1) || !/[a-zA-ZñÑ]/.test(k1)) { $('pfErr').textContent = 'La clave nueva debe tener mínimo 8 caracteres, con letras y números.'; return; }
      if (k1 !== k2) { $('pfErr').textContent = 'Las dos claves nuevas no coinciden.'; return; } d.claveActual = k0; d.claveNueva = k1; }
    const b = $('pfOk'); ocupado(b, 'Guardando…');
    try { const j = await gapi(d); usuario(j.usuario); cerrar(); toastG(d.claveNueva ? 'Perfil y clave actualizados' : 'Perfil actualizado'); } catch (e) { $('pfErr').textContent = e.message; ocupado(b); } };
}
$('perBtn').onclick = perfil;
setInterval(() => { if (S.clave && document.visibilityState==='visible') { S.rango=null; cargar(); } }, 10*60*1000);

/* ================= Gerencia M Clean: agendar y novedades ================= */
let OPC = null;
async function gapi(body){
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({clave:S.clave}, body)) });
  const j = await r.json(); if (!j.ok && /sesi[oó]n vencida/i.test(j.error||'')) { salir(); $('perr').textContent = j.error; throw new Error(j.error); }
  if (!j.ok && !j.duplicado) throw new Error(j.error || 'Error'); return j;
}
async function opciones(){ if (!OPC) OPC = await gapi({accion:'gerOpciones'}); return OPC; }
function comprimir(file){ return new Promise((res, rej) => { const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => { const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);

    L.map(t => { const k = r.lista.indexOf(t); return '<div class="okbox" style="background:#fff;border:1px solid var(--line);margin-top:8px"><b>'+(t.tipo==='Empresa'?'🏢 ':'👷 ')+esc(t.nombre)+'</b> <span style="font-size:12px;color:var(--mut)">'+esc(t.id)+'</span> <span style="font-size:12px;font-weight:700;color:'+(col[t.estado]||'var(--mut)')+'">'+esc(t.estado)+'</span>'+
      '<br><span style="font-size:12px;color:var(--mut)">'+esc(t.zona)+' · '+esc(t.celular||'')+(t.vence?' · vigente hasta '+esc(t.vence):'')+' · '+t.servicios+' servicio(s), '+t.terminados+' terminado(s)'+(t.mensajes?' · '+t.mensajes+' mensaje(s)'+(t.sinLeer?' ('+t.sinLeer+' sin leer)':''):'')+'</span>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="chip solo-admin" onclick="mensajeA('+k+')">💬 Mensaje</button>'+(t.tipo==='Empresa'?'':'<button class="chip solo-admin" onclick="tecnicoEditar(\''+esc(t.id)+'\')">✏️ Editar</button>')+'<a class="chip solo-admin" href="'+esc(t.ficha)+'" target="_blank" rel="noopener">Ver ficha</a>'+
      (t.tipo==='Empresa'?'<button class="chip solo-admin" onclick="empresaDe(\''+esc(t.id)+'\')">Completar datos</button>':'')+
      (t.estado==='Suspendido'?'<button class="chip solo-admin" onclick="tecEstado('+k+',\'Aprobado\')">Reactivar</button>':(t.estado==='Aprobado'?'<button class="chip solo-admin" onclick="tecEstado('+k+',\'Suspendido\')">Suspender</button>':''))+
      '<button class="chip solo-admin" style="color:#c0392b" onclick="tecEstado('+k+',\'Retirado\')">Retirar</button></div></div>'; }).join('')+
    (r.sinRegistro.length ? '<div class="sub" style="margin-top:16px;font-weight:700;color:var(--navy)">Nombres escritos en Trello sin perfil en la plataforma</div><div style="font-size:12px;color:var(--mut)">Tienen servicios próximos o en proceso. Si ya no trabajan con M Clean, reasigna esos servicios desde la agenda.</div>'+
      r.sinRegistro.map(x => '<div class="okbox" style="background:#fff6e0;margin-top:8px"><b>'+esc(x.nombre)+'</b> · '+x.servicios.length+' servicio(s)<br><span style="font-size:12px">'+x.servicios.map(v => (v.url?'<a href="'+esc(v.url)+'" target="_blank" rel="noopener" style="color:var(--blue)">':'')+esc(v.fecha+' · '+v.ciudad+(v.exp?' · Exp. '+v.exp:''))+(v.url?'</a>':'')).join('<br>')+'</span></div>').join('') : '')+
    '<div class="acc"><button class="a3 solo-admin" onclick="empresaForm(-1)">➕ Empresa aliada</button><button class="a3 solo-admin" onclick="tecnicoEditar(\'\')">➕ Técnico</button><button class="a4" style="grid-column:1/3" onclick="cerrar()">Cerrar</button></div>';
}
function tecnicoNuevo(i){
  $('hoja').innerHTML = '<h2>👷 Registrar técnico nuevo</h2><div class="sub">El técnico llena sus datos, toma su foto para el carnet y firma su contrato desde el celular (eso debe hacerlo él). Tú solo le envías el enlace y luego lo apruebas.</div><form class="frm" id="fTN"><label>Nombre</label><input id="tnNom" placeholder="Ej. Carlos Pérez"><label>Celular / WhatsApp</label><input id="tnCel" inputmode="tel" placeholder="3001234567"><div class="err" id="tnE"></div><div class="acc"><button type="button" class="a4" id="tnCan">Volver</button><button type="submit" class="a2">📲 Enviar enlace por WhatsApp</button></div></form>'+
    '<p style="font-size:12px;margin-top:10px;color:var(--mut)">Enlace: https://mcleandesinfeccion.github.io/registro.html · Cuando termine te llega el correo para aprobarlo y queda en 👷 Técnicos.</p>';
  $('modal').classList.add('on');
  $('tnCan').onclick = () => VIS[i] ? tecnicoForm(i) : tecnicos();
  $('fTN').onsubmit = ev => { ev.preventDefault(); const n = $('tnNom').value.trim(), c = $('tnCel').value.replace(/\D/g,'').replace(/^57(?=3\d{9}$)/,'');
    if (!/^3\d{9}$/.test(c)) { $('tnE').textContent = 'Escribe un celular de 10 dígitos.'; return; }
    window.open('https://wa.me/57'+c+'?text='+encodeURIComponent('Hola'+(n?' '+n:'')+', te saludamos de M Clean Desinfección y Limpieza. Para trabajar con nosotros como técnico aliado regístrate aquí (toma unos 10 minutos: datos, foto para tu carnet, cédula y firma del contrato): https://mcleandesinfeccion.github.io/registro.html'), '_blank'); };
}
async function empresaDe(id){ try { const L = (await gapi({accion:'gerEmpresas'})).empresas, e = L.find(x => x.id === id); if (e) empresaForm(-1, e); } catch (x) { toastG(x.message); } }
function mensajeA(k){ const t = _TEC[k]; if (!t) return;
  $('hoja').innerHTML = '<h2>💬 Mensaje a '+esc(t.nombre)+'</h2><div class="sub">'+(t.tipo==='Empresa'?'La empresa no usa app: le llega por correo y te abro WhatsApp con el texto.':'Le aparece en su app y le llega por correo. También puedes enviarlo por WhatsApp.')+'</div><form class="frm" id="fMs"><textarea id="msT" style="min-height:120px" placeholder="Escribe el mensaje…"></textarea><div class="err" id="msE"></div><div class="acc"><button type="button" class="a4" onclick="tecnicos()">Volver</button><button type="submit" class="a1" id="msOk">Enviar</button></div></form>';
  $('fMs').onsubmit = async ev => { ev.preventDefault(); const b = $('msOk'); b.disabled = true; b.textContent = 'Enviando…';
    try { const j = await gapi({accion:'gerMensaje', id:t.id, texto:$('msT').value});
      $('hoja').innerHTML = '<h2>✅ Mensaje enviado</h2><div class="okbox">'+(t.tipo==='Empresa'?'':'Quedó en su app. ')+(j.correo?'Se envió por correo.':'No tiene correo registrado.')+'</div><div class="acc">'+(j.wa?'<a class="a2" href="'+esc(j.wa)+'" target="_blank" rel="noopener">📲 Enviar también por WhatsApp</a>':'')+'<button class="a4" onclick="tecnicos()">Volver</button></div>';
    } catch (e) { $('msE').textContent = e.message; b.disabled = false; b.textContent = 'Enviar'; } };
}
async function tecEstado(k, est){ const t = _TEC[k]; if (!t) return;
  const txt = { Retirado:'¿Retirar a '+t.nombre+' de la plataforma? Ya no aparecerá en las listas ni recibirá servicios. Su historial y pagos se conservan.', Suspendido:'¿Suspender a '+t.nombre+'? No recibirá servicios hasta que lo reactives.', Aprobado:'¿Reactivar a '+t.nombre+'?' }[est];
  if (!confirm(txt)) return; const motivo = est === 'Aprobado' ? '' : (prompt('Motivo (opcional):') || '');
  try { const j = await gapi({accion:'gerTecnicoEstado', id:t.id, estado:est, motivo}); OPC = null;
    toastG(t.nombre+': '+est.toLowerCase()); if (j.pendientes && j.pendientes.length) alert('Ojo: tiene '+j.pendientes.length+' servicio(s) asignado(s) por reasignar:\n'+j.pendientes.join('\n')); tecnicos(); } catch (e) { toastG(e.message); } }
function toastG(t){ const d = document.createElement('div'); d.textContent = t; d.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0D2C54;color:#fff;padding:12px 18px;border-radius:14px;z-index:99;font-size:14px'; document.body.appendChild(d); setTimeout(()=>d.remove(), 3500); }
$('pagBtn').onclick = pagos;
$('tecBtn').onclick = () => tecnicos();
const APP_VER = 'g26';
function revisarVersion(){ fetch('version-gerencia.txt?'+Date.now(), {cache:'no-store'}).then(r => r.ok ? r.text() : '').then(v => { v = v.trim(); if (v && v !== APP_VER && !$('nuevaVer')) { const d = document.createElement('div'); d.id = 'nuevaVer'; d.innerHTML = '🔄 Hay una versión nueva de Gerencia. <b>Toca aquí para actualizar</b>'; d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:20px;background:#f6d046;color:#0D2C54;padding:14px 16px;border-radius:14px;z-index:999;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.25);cursor:pointer'; d.onclick = () => location.replace(location.pathname+'?v='+v); document.body.appendChild(d); } }).catch(()=>{}); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) revisarVersion(); }); setInterval(revisarVersion, 5*60e3); setTimeout(revisarVersion, 3000);
if (location.hash === '#pagos') setTimeout(() => { if (S.clave && S.u && !S.u.lector) pagos(); }, 1500);

async function guardarTrk(i){ const x = VIS[i]; if (!x) return; const url = ($('trkUrl').value||'').trim();
  try { await gapi({accion:'gerSeguimiento', id:x.id, url}); x.trk = url; toastG(url ? 'Enlace de seguimiento guardado' : 'Enlace eliminado'); detalle(x); } catch (e) { toastG(e.message); } }
</script>
