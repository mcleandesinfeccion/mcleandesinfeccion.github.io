<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16285a">
<title>Examen de ingreso · M Clean</title>
<link rel="icon" href="icon-tec-192.png">
<link rel="apple-touch-icon" href="icon-tec-180.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#16285a;--yel:#f6d046;--blue:#2c66b8;--bg:#f3f5fa;--line:#e3e8f2;--txt:#1b2540;--mut:#6b7590;--ok:#1f9d63;--err:#c0392b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
header{background:var(--navy);color:#fff;padding:14px 16px 16px;position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto}
.hrow img{height:38px;background:#fff;border-radius:10px;padding:4px 7px}
.hrow b{display:block;font-size:16px}.hrow small{font-size:12px;opacity:.8}
.bar{max-width:560px;margin:12px auto 0;height:6px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--yel);transition:width .25s}
main{max-width:560px;margin:0 auto;padding:18px 16px 110px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
h2{font-size:18px;color:var(--navy);line-height:1.3;margin-bottom:8px}
p{font-size:14px;line-height:1.55;color:var(--txt)}
.mut{color:var(--mut);font-size:13px}
.hola{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.stat{background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--navy);font-weight:800}
.stat span{font-size:11px;color:var(--mut)}
ol.reglas{padding-left:0;list-style:none;counter-reset:r}
ol.reglas li{counter-increment:r;position:relative;padding:8px 0 8px 36px;font-size:14px;line-height:1.5;border-bottom:1px dashed var(--line)}
ol.reglas li:last-child{border-bottom:0}
ol.reglas li:before{content:counter(r);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.alerta{background:#fff6d6;color:#7a5b00;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;margin:12px 0}
.alerta.r{background:#fde8e6;color:var(--err)}
.alerta.v{background:#e3f6ec;color:#16734a}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:14px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--navy);margin-top:2px;flex:none}
.btn{border:0;border-radius:14px;padding:15px;font:800 15px Poppins;cursor:pointer;text-align:center;display:block;width:100%}
.b1{background:var(--yel);color:var(--navy)}.b2{background:var(--navy);color:#fff}.b3{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.pnum{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
.preg{font-size:16px;font-weight:600;color:var(--navy);line-height:1.4;margin-bottom:12px}
.op{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:14px;line-height:1.45;transition:all .15s}
.op input{display:none}
.op .dot{width:20px;height:20px;border-radius:50%;border:2px solid #c3cbdc;flex:none;margin-top:1px}
.op.sel{border-color:var(--navy);background:#eef2fb}
.op.sel .dot{border-color:var(--navy);background:radial-gradient(var(--navy) 45%,transparent 50%)}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.foot .cnt{font-size:13px;color:var(--mut);white-space:nowrap}
.res{text-align:center;padding:26px 18px}
.res .ic{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:42px}
.res .ic.ok{background:#e3f6ec;color:var(--ok)}.res .ic.no{background:#fde8e6;color:var(--err)}
.res .nota{font-size:40px;font-weight:800;color:var(--navy);margin:6px 0}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:s 1s linear infinite;margin:30px auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
.pie{text-align:center;font-size:12px;color:var(--mut);margin-top:18px}
.pie a{color:var(--blue);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="hrow"><img src="logo-dark.webp" alt="M Clean"><div><b>Examen de ingreso</b><small id="sub">M Clean · Equipo técnico</small></div></div>
  <div class="bar" id="bar"><i id="barI"></i></div>
</header>
<main id="app"><div class="spin"></div><p class="mut" style="text-align:center">Cargando tu examen…</p></main>
<div class="foot" id="foot"><div class="in"><span class="cnt" id="cnt"></span><button class="btn b1" id="env" disabled>Enviar respuestas</button></div></div>
<script>
var API = 'https://script.google.com/macros/s/AKfycbwmj3prBAsOb77b5QTqPoY673GXdsZhBn0ef_ZaqDuX-9xzFoMCJFAs3Nq2tOeFoz2N/exec';
function leerTok(){var h=(location.hash||'').replace(/^#/,''),q=(location.search||'').replace(/^\?/,''),m=(h+'&'+q).match(/(?:^|&)t=([A-Za-z0-9_-]+)/);return m?m[1]:'';}
var T = leerTok(), S = null, P = null, enCurso = false, anulado = false;
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(b){b.t=T;return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(function(r){return r.json();});}
function pie(){return '<p class="pie">¿Dudas? WhatsApp <a href="https://wa.me/573226895212">322 689 5212</a> · mcleandesinfeccion@gmail.com</p>';}
function error(msg){enCurso=false;$('foot').style.display='none';$('bar').style.display='none';$('app').innerHTML='<div class="card res"><div class="ic no">!</div><h2>No pudimos continuar</h2><p>'+esc(msg)+'</p></div>'+pie();}
function cargando(t){$('app').innerHTML='<div class="spin"></div><p class="mut" style="text-align:center">'+esc(t)+'</p>';}

function inicio(){
  if(!T) return error('Enlace no válido. Abre el botón del correo que te enviamos.');
  api({accion:'examenEstado'}).then(function(r){
    if(!r.ok) return error(r.error||'Enlace no válido.');
    S=r; $('sub').textContent=(r.nombre||'')+' · M Clean';
    if(r.ultimo&&r.ultimo.estado==='Aprobado') return resultado({aprobado:true,correctas:r.ultimo.correctas,n:r.n,min:r.min},true);
    if(!r.capacitacion) return error('Primero completa tu capacitación: lee el manual, mira el video y toca «Leí y entendí» en el correo de capacitación. Después vuelve a este enlace.');
    reglas();
  }).catch(function(){error('No hay conexión. Revisa tus datos o wifi e intenta de nuevo.');});
}

function reglas(){
  var n=S.n||6,min=S.min||4;
  $('app').innerHTML='<div class="card"><div class="hola">Hola, '+esc((S.nombre||'').split(' ')[0])+' 👋</div><p class="mut">Último paso para empezar a recibir servicios de M Clean.</p>'+
  '<div class="stats"><div class="stat"><b>'+n+'</b><span>preguntas</span></div><div class="stat"><b>'+min+'</b><span>para aprobar</span></div><div class="stat"><b>~5</b><span>minutos</span></div></div></div>'+
  '<div class="card"><h2>Instrucciones y reglas</h2><ol class="reglas">'+
  '<li>Son <b>'+n+' preguntas</b> de selección múltiple, con <b>una sola respuesta correcta</b>.</li>'+
  '<li>Las preguntas salen <b>al azar</b> del manual del técnico y del video de capacitación.</li>'+
  '<li>Apruebas con <b>'+min+' o más</b> respuestas correctas.</li>'+
  '<li><b>No salgas de esta pantalla</b>: si cierras, recargas, cambias de aplicación o bloqueas el celular, el intento se <b>anula</b> y vuelves a empezar con <b>preguntas diferentes</b>.</li>'+
  '<li>Debes responder todas las preguntas para poder enviar.</li>'+
  '<li>Verás tu resultado de inmediato y también te llegará por correo.</li>'+
  '<li>Respóndelo tú mismo, sin ayuda. Tu intento queda registrado con fecha y hora.</li></ol>'+
  '<div class="alerta">Antes de iniciar, ten buena señal y la batería cargada.</div>'+
  '<label class="check"><input type="checkbox" id="acepto"><span>Leí las instrucciones y acepto las reglas.</span></label>'+
  '<button class="btn b2" id="ini" disabled>Iniciar examen</button></div>'+pie();
  $('acepto').onchange=function(){$('ini').disabled=!this.checked;};
  $('ini').onclick=iniciar;
}

function iniciar(){
  cargando('Preparando tus preguntas…');
  api({accion:'examenIniciar'}).then(function(r){
    if(!r.ok) return error(r.error||'No se pudo iniciar el examen.');
    P=r; enCurso=true; anulado=false; pintar();
  }).catch(function(){error('No hay conexión. Intenta de nuevo.');});
}

function pintar(){
  var h='';
  P.preguntas.forEach(function(p,k){
    h+='<div class="card"><div class="pnum">Pregunta '+(k+1)+' de '+P.preguntas.length+'</div><div class="preg">'+esc(p.q)+'</div>';
    p.ops.forEach(function(o){h+='<label class="op"><input type="radio" name="q'+k+'" value="'+esc(o)+'"><span class="dot"></span><span>'+esc(o)+'</span></label>';});
    h+='</div>';
  });
  $('app').innerHTML=h; window.scrollTo(0,0);
  $('bar').style.display='block'; $('foot').style.display='block';
  Array.prototype.forEach.call(document.querySelectorAll('.op input'),function(i){i.onchange=function(){
    Array.prototype.forEach.call(document.getElementsByName(i.name),function(x){x.parentNode.classList.toggle('sel',x.checked);});
    progreso();
  };});
  progreso(); $('env').onclick=enviar;
}
function respuestas(){var a=[];for(var k=0;k<P.preguntas.length;k++){var s=document.querySelector('input[name="q'+k+'"]:checked');a.push(s?s.value:null);}return a;}
function progreso(){var a=respuestas(),c=a.filter(function(x){return x!==null;}).length,n=a.length;$('cnt').textContent=c+' de '+n;$('barI').style.width=(100*c/n)+'%';$('env').disabled=c<n;}

function enviar(){
  var a=respuestas(); if(a.indexOf(null)>=0) return;
  enCurso=false; $('env').disabled=true; $('env').textContent='Enviando…';
  api({accion:'examenResponder',id:P.id,resp:a}).then(function(x){
    $('foot').style.display='none'; $('bar').style.display='none';
    if(!x.ok) return error(x.error||'No se pudo enviar.');
    resultado(x,false);
  }).catch(function(){enCurso=true;$('env').disabled=false;$('env').textContent='Enviar respuestas';alert('No hay conexión. Toca «Enviar respuestas» de nuevo.');});
}

function resultado(x,previo){
  enCurso=false;
  var ok=!!x.aprobado;
  $('app').innerHTML='<div class="card res"><div class="ic '+(ok?'ok':'no')+'">'+(ok?'✓':'✕')+'</div>'+
  '<h2>'+(previo?'Ya aprobaste tu examen':(ok?'¡Aprobaste!':'No aprobaste'))+'</h2>'+
  '<div class="nota">'+esc(x.correctas)+' / '+esc(x.n||(S&&S.n)||'')+'</div>'+
  '<p class="mut">Mínimo para aprobar: '+esc(x.min||(S&&S.min)||'')+' respuestas correctas.</p>'+
  '<div class="alerta'+(ok?' v':' r')+'" style="margin-top:16px">'+(ok?'Bienvenido(a) al equipo técnico de M Clean. Ya puedes recibir servicios en la app de técnicos.':'Repasa el manual y el video. M Clean te contactará para habilitarte un nuevo intento.')+'</div></div>'+pie();
}

function anular(){
  if(!enCurso||anulado) return;
  anulado=true; enCurso=false;
  $('foot').style.display='none'; $('bar').style.display='none';
  $('app').innerHTML='<div class="card res"><div class="ic no">!</div><h2>Intento anulado</h2><p>Saliste de la pantalla del examen. Por las reglas, este intento se anuló.</p><p class="mut" style="margin-top:8px">Si vuelves a empezar, te saldrán preguntas diferentes.</p><button class="btn b2" style="margin-top:16px" id="otra">Empezar de nuevo</button></div>'+pie();
  $('otra').onclick=reglas;
}
document.addEventListener('visibilitychange',function(){if(document.hidden) anular();});
window.addEventListener('pagehide',anular);
window.addEventListener('beforeunload',function(e){if(enCurso){e.preventDefault();e.returnValue='Si sales, el intento se anula.';}});
inicio();
</script>
</body>
</html>
