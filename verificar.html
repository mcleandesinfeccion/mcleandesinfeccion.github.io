<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16285a">
<title>Verificación de técnico · M Clean</title>
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#16285a;--yel:#f6d046;--blue:#2c66b8;--bg:#f3f5fa;--line:#e3e8f2;--txt:#1b2540;--mut:#6b7590;--ok:#1f9d63;--err:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;background:linear-gradient(170deg,#16285a 0,#2c66b8 300px,var(--bg) 300px);min-height:100vh;color:var(--txt)}
main{max-width:420px;margin:0 auto;padding:22px 16px 40px;text-align:center}
.logo{background:#fff;border-radius:16px;padding:8px 14px;display:inline-block;margin-bottom:10px}
.logo img{height:46px;display:block}
h1{color:#fff;font-size:15px;font-weight:600;opacity:.9;margin-bottom:18px}
.card{background:#fff;border-radius:24px;padding:26px 20px;box-shadow:0 18px 40px rgba(10,20,50,.25)}
.foto{width:150px;height:150px;border-radius:50%;object-fit:cover;border:6px solid var(--yel);margin:0 auto 12px;display:block;background:#eef}
.est{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:20px;border-radius:999px;padding:8px 22px;margin-bottom:14px}
.si{background:#e2f6ec;color:var(--ok)}.no{background:#fde8e6;color:var(--err)}
h2{font-size:22px;color:var(--navy);line-height:1.25}
.cargo{color:var(--mut);font-size:14px;margin:4px 0 12px}
.fila{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.fila b{color:var(--mut);font-weight:500}
.nota{font-size:12px;color:var(--mut);margin-top:16px;line-height:1.5}
.btn{display:block;margin-top:16px;background:#25d366;color:#fff;text-decoration:none;font-weight:800;border-radius:14px;padding:13px}
.hora{font-size:12px;color:var(--mut);margin-top:10px}
</style>
</head>
<body>
<main>
  <div class="logo"><img src="logo-dark.webp" alt="M Clean"></div>
  <h1>Verificación de técnico aliado</h1>
  <div class="card" id="app">Verificando…</div>
</main>
<script>
var API = 'https://script.google.com/macros/s/AKfycbwmj3prBAsOb77b5QTqPoY673GXdsZhBn0ef_ZaqDuX-9xzFoMCJFAs3Nq2tOeFoz2N/exec';
var COD = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fechaBonita(s) { var m = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre']; var p = String(s).split('-'); return p.length === 3 ? (+p[2]) + ' de ' + m[+p[1] - 1] + ' de ' + p[0] : s; }
var wa = 'https://wa.me/573226895212?text=' + encodeURIComponent('Hola M Clean, quiero confirmar la identidad del técnico con código ' + COD);
var ahora = new Date().toLocaleString('es-CO', { dateStyle: 'long', timeStyle: 'short' });
function pintar(d) {
  var a = document.getElementById('app');
  if (!d.encontrado) { a.innerHTML = '<div class="est no">✖ NO REGISTRADO</div><p class="cargo">Este código no corresponde a ningún técnico aliado de M Clean. No permita el ingreso y comuníquese con nosotros.</p><a class="btn" href="' + wa + '">Confirmar con M Clean</a><p class="hora">Consultado el ' + esc(ahora) + '</p>'; return; }
  a.innerHTML = (d.foto ? '<img class="foto" src="' + d.foto + '" alt="">' : '') +
    '<div class="est ' + (d.vigente ? 'si' : 'no') + '">' + (d.vigente ? '✔ ' : '✖ ') + esc(d.estado) + '</div>' +
    '<h2>' + esc(d.nombre) + '</h2><p class="cargo">' + esc(d.cargo) + '</p>' +
    '<div class="fila"><b>Empresa</b><span>M Clean Desinfección y Limpieza S.A.S.</span></div>' +
    '<div class="fila"><b>Zona</b><span>' + esc(d.zona) + '</span></div>' +
    '<div class="fila"><b>Vigente hasta</b><span>' + esc(fechaBonita(d.vence)) + '</span></div>' +
    '<div class="fila"><b>Código</b><span>' + esc(COD) + '</span></div>' +
    (d.vigente ? '<p class="nota">Compare la foto con la persona que tiene enfrente. Esta consulta se hace en tiempo real con los registros de M Clean.</p>' : '<p class="nota"><b>Este carnet no está vigente.</b> Comuníquese con M Clean antes de permitir el ingreso.</p>') +
    '<a class="btn" href="' + wa + '">Confirmar con M Clean por WhatsApp</a><p class="hora">Consultado el ' + esc(ahora) + '</p>';
}
if (!COD) document.getElementById('app').textContent = 'Escanea el código QR del carnet.';
else fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: 'verificarCarnet', c: COD }) })
  .then(function (r) { return r.json(); }).then(function (j) { if (!j.ok) throw new Error(j.error); pintar(j); })
  .catch(function () { document.getElementById('app').innerHTML = 'No se pudo verificar en este momento. <a class="btn" href="' + wa + '">Confirmar con M Clean</a>'; });
</script>
</body>
</html>
