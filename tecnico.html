<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16285a">
<title>Técnicos M Clean</title>
<link rel="manifest" href="manifest-tecnico.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Técnicos M Clean">
<link rel="icon" href="icon-tec-192.png">
<link rel="apple-touch-icon" href="icon-tec-180.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#16285a;--yel:#f6d046;--blue:#2c66b8;--bg:#f3f5fa;--line:#e3e8f2;--txt:#1b2540;--mut:#6b7590;--ok:#1f9d63;--err:#c0392b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
header{background:var(--navy);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.hrow img{height:34px;background:#fff;border-radius:10px;padding:3px 6px}
.hrow div{flex:1}.hrow b{display:block;font-size:15px}.hrow small{font-size:11px;opacity:.75}
.ib{background:rgba(255,255,255,.12);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer}
.tabs{display:flex;max-width:560px;margin:12px auto 0}
.tabs button{flex:1;background:none;border:0;color:rgba(255,255,255,.65);font:600 14px Poppins;padding:10px 0 12px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:#fff;border-bottom-color:var(--yel)}
.tabs em{font-style:normal;background:var(--yel);color:var(--navy);border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px}
main{max-width:560px;margin:0 auto;padding:16px 16px 90px}
.aviso{background:#fff6d6;color:#7a5b00;border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:14px}
.aviso.r{background:#fde8e6;color:var(--err)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{font-size:16px;color:var(--navy);line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);margin:8px 0 12px}
.pago{font-size:22px;font-weight:800;color:var(--ok)}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:13px;font:800 15px Poppins;cursor:pointer;text-align:center;text-decoration:none;display:block;width:100%}
.b1{background:var(--yel);color:var(--navy)}.b2{background:var(--navy);color:#fff}.b3{background:#fff;color:var(--navy);border:1.5px solid var(--line)}.b4{background:var(--ok);color:#fff}
.btn:disabled{opacity:.45}
.vacio{text-align:center;color:var(--mut);padding:40px 10px;font-size:14px}
.vacio .ic{font-size:44px;margin-bottom:8px}
.fila{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.fila b{flex:0 0 96px;color:var(--mut);font-weight:500}
.pasos{display:flex;gap:6px;margin:12px 0}
.pasos span{flex:1;text-align:center;font-size:11px;font-weight:700;padding:7px 2px;border-radius:10px;background:var(--bg);color:var(--mut)}
.pasos span.ok{background:#e2f6ec;color:var(--ok)}
.dia{font-size:13px;font-weight:700;color:var(--navy);margin:14px 2px 8px;text-transform:capitalize}
.modal{position:fixed;inset:0;background:rgba(10,18,40,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.hoja{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 26px}
.hoja h2{font-size:18px;color:var(--navy);margin-bottom:6px}
.decl{background:var(--bg);border-radius:14px;padding:12px;font-size:12.5px;line-height:1.55;margin:10px 0;text-align:justify}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:8px 0 14px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--navy)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:14px Poppins;margin:8px 0 12px}
.carga{position:fixed;inset:0;background:rgba(22,40,90,.8);color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:60;font-weight:600}
.carga.on{display:flex}
.spin{width:42px;height:42px;border:5px solid rgba(255,255,255,.25);border-top-color:var(--yel);border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.toast{position:fixed;left:16px;right:16px;bottom:20px;max-width:528px;margin:0 auto;background:var(--navy);color:#fff;border-radius:14px;padding:13px 16px;font-size:14px;z-index:70;display:none}
.toast.on{display:block}
.full{position:fixed;inset:0;background:var(--bg);z-index:55;display:none;flex-direction:column}
.full.on{display:flex}
.fhead{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.fhead b{flex:1;font-size:15px}.fhead small{display:block;font-size:11px;opacity:.75;font-weight:500}
.fbody{flex:1;overflow:auto;padding:16px;max-width:560px;width:100%;margin:0 auto}
.fpie{background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.fpie div{max-width:560px;margin:0 auto;display:flex;gap:10px}.fpie .b3{flex:0 0 34%}
.grupo{margin-bottom:14px}.grupo h4{font-size:13px;color:var(--navy);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:600 12.5px Poppins;cursor:pointer;color:var(--txt)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.fotob{display:flex;align-items:center;gap:12px;background:#fff;border:2px dashed #c8d2e6;border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.fotob .n{margin-left:auto;background:var(--navy);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.fotob.ok{border-style:solid;border-color:var(--ok)}
.ev{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.ev .o{display:flex;gap:6px}.ev .o button{width:36px;height:36px;border-radius:50%;border:1.5px solid #e07a2e;background:#fff;color:#e07a2e;font:800 13px Poppins;cursor:pointer}
.ev .o button.on{background:#e07a2e;color:#fff}
.pad{background:#fff;border:1.5px solid var(--line);border-radius:14px;position:relative;touch-action:none;margin-bottom:6px}
.pad canvas{width:100%;height:160px;display:block}
.pad .ph{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:11px;color:var(--mut);pointer-events:none}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px;font:14px Poppins;margin-bottom:8px}
.lnk{background:none;border:0;color:var(--err);font:700 13px Poppins;cursor:pointer;padding:8px 0;text-decoration:underline}
.wa{position:fixed;right:16px;bottom:18px;width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:30}
</style>
</head>
<body>
<header>
  <div class="hrow"><img src="logo-dark.webp" alt="M Clean"><div><b id="nom">Técnico aliado</b><small id="zona">M Clean</small></div><button class="ib" id="rec" title="Actualizar">⟳</button></div>
  <div class="tabs"><button class="on" data-t="ofertas">Ofertas <em id="nOf">0</em></button><button data-t="agenda">Mi agenda <em id="nAg">0</em></button><button data-t="carnet">Carnet</button></div>
</header>
<main id="app"><div class="vacio">Cargando…</div></main>
<a class="wa" href="https://wa.me/573226895212" title="Escribir a M Clean">💬</a>
<div class="modal" id="modal"><div class="hoja" id="hoja"></div></div>
<div class="carga" id="carga"><div class="spin"></div><div id="cargaTxt">Un momento…</div></div>
<div class="toast" id="toast"></div>
<div class="full" id="acta"><div class="fhead"><b id="aTit">Acta del servicio<small id="aSub"></small></b><button class="ib" id="aCerrar">✕</button></div><div class="fbody" id="aBody"></div><div class="fpie"><div><button class="btn b3" id="aAtras">Atrás</button><button class="btn b1" id="aSig">Siguiente</button></div></div></div>
<input type="file" id="aFile" accept="image/*" capture="environment" style="display:none">
<script>
var API = 'https://script.google.com/macros/s/AKfycbwmj3prBAsOb77b5QTqPoY673GXdsZhBn0ef_ZaqDuX-9xzFoMCJFAs3Nq2tOeFoz2N/exec';
var st = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
var TOKEN = (location.hash.match(/t=([^&]+)/) || [])[1] || st.get('mc_tec') || '';
if (TOKEN) st.set('mc_tec', TOKEN);
var D = null, TAB = 'ofertas', watchId = null;
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function api(b) { b.t = TOKEN; return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(b) }).then(function (r) { return r.json(); }); }
function carga(on, t) { $('carga').classList.toggle('on', !!on); if (t) $('cargaTxt').textContent = t; }
function toast(t) { var x = $('toast'); x.textContent = t; x.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { x.classList.remove('on'); }, 4000); }
function pesos(n) { return n ? '$' + Number(n).toLocaleString('es-CO') : 'Valor por confirmar'; }
function fechaTxt(f) { var p = String(f).split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return d.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' }); }
function hora12(h) { if (!h) return ''; var p = h.split(':'), H = +p[0], M = p[1]; return (H % 12 || 12) + ':' + M + (H >= 12 ? ' p. m.' : ' a. m.'); }
function geo() { return new Promise(function (res) { if (!navigator.geolocation) return res(null); var t = setTimeout(function () { res(null); }, 12000); navigator.geolocation.getCurrentPosition(function (p) { clearTimeout(t); res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }); }, function () { clearTimeout(t); res(null); }, { enableHighAccuracy: true, timeout: 11000, maximumAge: 10000 }); }); }

function cargar() {
  return api({ accion: 'portalTecnico' }).then(function (j) {
    if (!j.ok) { $('app').innerHTML = '<div class="vacio"><div class="ic">🔒</div>' + esc(j.error) + '</div>'; return; }
    D = j; $('nom').textContent = j.perfil.nombre; $('zona').textContent = 'Zona ' + j.perfil.zona;
    $('nOf').textContent = j.ofertas.length; $('nAg').textContent = j.servicios.length;
    pintar(); seguir();
  }).catch(function () { $('app').innerHTML = '<div class="vacio"><div class="ic">📶</div>Sin conexión. Revisa tu internet.</div>'; });
}
function pintar() {
  var p = D.perfil, h = '';
  if (p.motivo) h += '<div class="aviso' + (p.estado === 'Suspendido' ? ' r' : '') + '">' + esc(p.motivo) + '</div>';
  if (p.rutPendiente) h += '<div class="aviso">📄 Falta tu RUT. Súbelo desde la pestaña <b>Carnet</b>.</div>';
  if (TAB === 'ofertas') {
    if (!D.ofertas.length) h += '<div class="vacio"><div class="ic">📭</div>No hay ofertas en tu zona en este momento.<br>Te avisaremos por correo cuando llegue una.</div>';
    D.ofertas.forEach(function (o) {
      h += '<div class="card"><h3>' + esc(o.tipo) + '</h3><div class="meta"><span>📍 ' + esc(o.ciudad) + '</span><span>📅 ' + esc(fechaTxt(o.fecha)) + '</span>' + (o.hora ? '<span>🕐 ' + hora12(o.hora) + '</span>' : '') + '</div>' +
        '<div class="pago">' + pesos(o.pago) + '</div><p style="font-size:12px;color:#6b7590;margin:4px 0 12px">Eres libre de aceptar o rechazar. Lo toma el primero que acepte.</p>' +
        '<div class="acc"><button class="btn b3" data-rech="' + o.id + '">No puedo</button><button class="btn b1" data-acep="' + o.id + '"' + (p.puedeAceptar ? '' : ' disabled') + '>Aceptar</button></div></div>';
    });
  } else if (TAB === 'agenda') {
    if (!D.servicios.length) h += '<div class="vacio"><div class="ic">🗓️</div>No tienes servicios aceptados.</div>';
    var ult = '';
    D.servicios.forEach(function (s) {
      if (s.fecha !== ult) { h += '<div class="dia">' + esc(fechaTxt(s.fecha)) + '</div>'; ult = s.fecha; }
      var dest = s.lat ? s.lat + ',' + s.lng : encodeURIComponent(s.direccion + ', ' + s.ciudad + ', Colombia');
      h += '<div class="card"><h3>' + (s.hora ? hora12(s.hora) + ' · ' : '') + esc(s.tipo) + '</h3>' +
        '<div class="fila"><b>Usuario</b><span>' + esc(s.cliente || '—') + '</span></div>' +
        '<div class="fila"><b>Dirección</b><span>' + esc(s.direccion || '—') + ', ' + esc(s.ciudad) + '</span></div>' +
        (s.exp ? '<div class="fila"><b>Expediente</b><span>' + esc(s.exp) + '</span></div>' : '') +
        (s.detalle ? '<div class="fila"><b>Detalle</b><span>' + esc(s.detalle) + '</span></div>' : '') +
        '<div class="fila"><b>Pago</b><span style="color:#1f9d63;font-weight:700">' + pesos(s.pago) + '</span></div>' +
        '<div class="pasos"><span class="' + (s.salida ? 'ok' : '') + '">🚗 Salida' + (s.salida ? ' ' + s.salida.slice(11, 16) : '') + '</span><span class="' + (s.llegada ? 'ok' : '') + '">📍 Llegada' + (s.llegada ? ' ' + s.llegada.slice(11, 16) : '') + '</span><span class="' + (s.terminado ? 'ok' : '') + '">✅ Fin' + (s.terminado ? ' ' + s.terminado.slice(11, 16) : '') + '</span></div>' +
        '<div class="acc" style="margin-bottom:10px"><a class="btn b3" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=' + dest + '&travelmode=driving">🗺️ Google Maps</a><a class="btn b3" target="_blank" href="https://waze.com/ul?' + (s.lat ? 'll=' + s.lat + ',' + s.lng : 'q=' + encodeURIComponent(s.direccion + ', ' + s.ciudad)) + '&navigate=yes">🚙 Waze</a></div>' +
        (!s.salida ? '<button class="btn b2" data-ev="salida" data-id="' + s.id + '"' + (s.puedeSalir ? '' : ' disabled') + '>🚗 Salgo hacia el servicio</button>' + (s.puedeSalir ? '' : '<p style="font-size:12px;color:#6b7590;text-align:center;margin-top:6px">Disponible desde una hora antes del servicio</p>') :
          !s.llegada ? '<button class="btn b1" data-ev="llegada" data-id="' + s.id + '">📍 Llegué al sitio</button>' :
            !s.terminado ? '<button class="btn b4" data-acta="' + s.id + '">📝 Completar acta y terminar</button>' : '<p style="text-align:center;color:#1f9d63;font-weight:700">Servicio terminado ✔</p>') + '</div>';
    });
  } else {
    h += '<div class="card" style="text-align:center"><h3>Mi carnet</h3><p style="font-size:13px;color:#6b7590;margin:6px 0 14px">Tu carnet con foto, QR y sello de M Clean.</p><a class="btn b1" href="carnet.html#t=' + TOKEN + '">Abrir mi carnet</a></div>' +
      '<div class="card"><h3>¿Cómo funciona?</h3><p style="font-size:13px;color:#6b7590;margin-top:6px;line-height:1.6">1. Te llegan ofertas de tu zona; aceptas solo las que quieras.<br>2. El día del servicio toca <b>Salgo</b> (desde 1 hora antes), <b>Llegué</b> y <b>Terminé</b>.<br>3. Tu ubicación solo se registra durante el servicio aceptado.<br>4. Se te paga por cada servicio realizado.</p></div>';
  }
  $('app').innerHTML = h;
}
document.addEventListener('click', function (e) {
  var t = e.target.closest('.tabs button'); if (t) { TAB = t.getAttribute('data-t'); Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.classList.toggle('on', b === t); }); pintar(); window.scrollTo(0, 0); return; }
  var a = e.target.closest('[data-acep]'); if (a) return abrirAceptar(a.getAttribute('data-acep'));
  var r = e.target.closest('[data-rech]'); if (r) { var id = r.getAttribute('data-rech'); carga(true, 'Un momento…'); api({ accion: 'rechazarOferta', oferta: id }).then(function () { carga(false); toast('Listo, no te mostraremos esta oferta.'); cargar(); }); return; }
  var ac = e.target.closest('[data-acta]'); if (ac) return abrirActa(ac.getAttribute('data-acta'));
  var v = e.target.closest('[data-ev]'); if (v) return evento(v.getAttribute('data-ev'), v.getAttribute('data-id'));
  if (e.target.id === 'modal') cerrar();
});
function cerrar() { $('modal').classList.remove('on'); }
function abrirAceptar(id) {
  var o = D.ofertas.filter(function (x) { return x.id === id; })[0]; if (!o) return;
  $('hoja').innerHTML = '<h2>Aceptar servicio</h2><p style="font-size:14px"><b>' + esc(o.tipo) + '</b><br>📍 ' + esc(o.ciudad) + ' · 📅 ' + esc(fechaTxt(o.fecha)) + (o.hora ? ' · 🕐 ' + hora12(o.hora) : '') + '<br>💵 <b style="color:#1f9d63">' + pesos(o.pago) + '</b></p>' +
    '<div class="decl">' + esc(D.declaracion) + '</div><label class="chk"><input type="checkbox" id="dChk"><span>Acepto esta declaración y el servicio en la fecha y hora indicadas.</span></label>' +
    '<div class="acc"><button class="btn b3" onclick="cerrar()">Cancelar</button><button class="btn b1" id="confirmar">Aceptar servicio</button></div>';
  $('modal').classList.add('on');
  $('confirmar').onclick = function () {
    if (!$('dChk').checked) { toast('Marca la declaración para continuar.'); return; }
    carga(true, 'Confirmando…');
    geo().then(function (g) { return api({ accion: 'aceptarOferta', oferta: id, declaracion: true, geo: g }); })
      .then(function (j) { carga(false); cerrar(); if (!j.ok) { toast(j.error); cargar(); return; } toast('¡Servicio aceptado! Lo verás en Mi agenda.'); TAB = 'agenda'; Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === 'agenda'); }); cargar(); });
  };
}
function evento(ev, id, forzar, nota) {
  carga(true, 'Obteniendo tu ubicación…');
  geo().then(function (g) {
    if (!g) { carga(false); toast('Activa la ubicación (GPS) de tu celular y vuelve a intentarlo.'); return; }
    carga(true, 'Registrando…');
    return api({ accion: 'eventoServicio', oferta: id, evento: ev, geo: g, forzar: !!forzar, nota: nota || '' }).then(function (j) {
      carga(false);
      if (j.lejos) return lejos(id, j.distancia);
      if (!j.ok) { toast(j.error); return; }
      toast(ev === 'salida' ? '¡Buen viaje! Registramos tu salida.' : ev === 'llegada' ? 'Llegada registrada.' : '¡Servicio terminado! Gracias.');
      cargar();
      if (j.wa) { $('hoja').innerHTML = '<h2>' + (ev === 'salida' ? 'Avisa al cliente que vas en camino' : 'Avisa al cliente que llegaste') + '</h2><p style="font-size:14px;color:#6b7590">Toca el botón y envía el mensaje que ya está escrito por WhatsApp.</p><div class="acc"><button class="btn b3" onclick="cerrar()">Ahora no</button><a class="btn b1" style="background:#25d366;color:#fff;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="' + j.wa + '" onclick="setTimeout(cerrar,500)">Avisar por WhatsApp</a></div>'; $('modal').classList.add('on'); }
    });
  });
}
function lejos(id, d) {
  $('hoja').innerHTML = '<h2>Estás lejos de la dirección</h2><p style="font-size:14px;color:#6b7590">Tu ubicación está a <b>' + (d >= 1000 ? (d / 1000).toFixed(1) + ' km' : d + ' m') + '</b> del punto del servicio. Si ya estás en el sitio y el mapa no coincide, cuéntanos por qué:</p>' +
    '<textarea id="nota" rows="3" placeholder="Ej: la dirección en el mapa sale en otra cuadra"></textarea><div class="acc"><button class="btn b3" onclick="cerrar()">Volver</button><button class="btn b1" id="forzar">Registrar llegada</button></div>';
  $('modal').classList.add('on');
  $('forzar').onclick = function () { var n = $('nota').value.trim(); if (n.length < 5) { toast('Escribe una breve explicación.'); return; } cerrar(); evento('llegada', id, true, n); };
}
function seguir() {
  var enCamino = D && D.servicios.filter(function (s) { return s.salida && !s.llegada; })[0];
  if (enCamino && navigator.geolocation && watchId === null) {
    watchId = navigator.geolocation.watchPosition(function (p) {
      if (document.visibilityState !== 'visible') return;
      api({ accion: 'eventoServicio', oferta: enCamino.id, evento: 'punto', geo: { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy } });
    }, function () { }, { enableHighAccuracy: true, maximumAge: 60000 });
  } else if (!enCamino && watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
}

/* ======== Acta de calidad (fase 3) ======== */
var A = null;
function chipsHtml(k, lista) { return '<div class="chips">' + lista.map(function (v) { return '<button class="chip' + (A.sel[k].indexOf(v) >= 0 ? ' on' : '') + '" data-k="' + k + '" data-v="' + esc(v) + '">' + esc(v) + '</button>'; }).join('') + '</div>'; }
function abrirActa(id) {
  carga(true, 'Preparando el acta…');
  api({ accion: 'actaInfo', oferta: id }).then(function (j) {
    carga(false); if (!j.ok) { toast(j.error); return; }
    A = { id: id, info: j, paso: 0, sel: { diagnostico: [], causa: [], trabajo: [], acabados: [], precauciones: [] }, ev: {}, negativa: null, nAntes: j.fotosAntes, nDesp: j.fotosDespues, nEvid: j.evidencia ? 1 : 0, pads: {} };
    $('acta').classList.add('on'); pasoActa();
  });
}
function cerrarActa() { $('acta').classList.remove('on'); A = null; }
$('aCerrar').onclick = cerrarActa;
var TIT = ['Fotos del servicio', 'Diagnóstico y trabajo', 'Usuario: revisión y firma', 'Tu firma'];
function pasoActa() {
  var j = A.info, h = '';
  $('aTit').firstChild.textContent = TIT[A.paso]; $('aSub').textContent = 'Paso ' + (A.paso + 1) + ' de 4';
  $('aAtras').style.visibility = A.paso ? 'visible' : 'hidden';
  $('aSig').textContent = A.paso === 3 ? 'Enviar acta y terminar' : 'Siguiente';
  if (A.paso === 0) {
    h = '<p style="font-size:13px;color:#6b7590;margin-bottom:12px">Toma fotos claras del antes y del después. Se guardan al instante.</p>' +
      '<div class="fotob' + (A.nAntes ? ' ok' : '') + '" data-foto="antes"><span style="font-size:28px">📸</span><div><b>Fotos de ANTES</b><br><small>Mínimo 1 · máximo 6</small></div><span class="n">' + A.nAntes + '</span></div>' +
      '<div class="fotob' + (A.nDesp ? ' ok' : '') + '" data-foto="despues"><span style="font-size:28px">✨</span><div><b>Fotos de DESPUÉS</b><br><small>Mínimo 1 · máximo 6</small></div><span class="n">' + A.nDesp + '</span></div>';
  } else if (A.paso === 1) {
    var tits = { diagnostico: 'Diagnóstico inicial', causa: 'Causa', trabajo: 'Trabajo realizado', acabados: 'Diagnóstico de acabados', precauciones: 'Precauciones para el usuario' };
    Object.keys(tits).forEach(function (k) { h += '<div class="grupo"><h4>' + tits[k] + '</h4>' + chipsHtml(k, j.opciones[k]) + '</div>'; });
    h += '<div class="grupo"><h4>Observaciones (opcional · puedes dictar con el micrófono del teclado)</h4><textarea class="inp" id="aNota" rows="3">' + esc(A.nota || '') + '</textarea></div>';
  } else if (A.paso === 2) {
    if (!A.negativa) {
      h = '<p style="font-size:13px;color:#6b7590;margin-bottom:10px">Entrega el celular al usuario para que revise, califique y firme.</p>' +
        '<input class="inp" id="uNom" placeholder="Nombre completo del usuario" value="' + esc(A.uNom || '') + '"><input class="inp" id="uCed" inputmode="numeric" placeholder="Número de cédula" value="' + esc(A.uCed || '') + '">' +
        '<div class="decl">Yo, el usuario identificado arriba, ' + esc(j.textos.inicial) + '</div><div class="grupo"><h4>Evaluación del servicio</h4>' +
        [['tiempo', 'Tiempo de respuesta'], ['resultado', 'Resultado del trabajo'], ['presentacion', 'Presentación personal']].map(function (r) { return '<div class="ev"><span>' + r[1] + '</span><span class="o">' + ['E', 'B', 'R', 'M'].map(function (v) { return '<button data-e="' + r[0] + '" data-v="' + v + '" class="' + (A.ev[r[0]] === v ? 'on' : '') + '">' + v + '</button>'; }).join('') + '</span></div>'; }).join('') +
        '<div class="ev"><span>Uso de elementos de seguridad</span><span class="o">' + ['S', 'N'].map(function (v) { return '<button data-e="seguridad" data-v="' + v + '" class="' + (A.ev.seguridad === v ? 'on' : '') + '">' + v + '</button>'; }).join('') + '</span></div>' +
        '<p style="font-size:11px;color:#6b7590;margin-top:6px">E: Excelente · B: Bueno · R: Regular · M: Malo</p></div>' +
        '<div class="decl">' + esc(j.textos.final) + '</div><h4 style="font-size:13px;color:#16285a;margin:10px 0 6px">Firma del usuario</h4><div class="pad"><canvas id="padU"></canvas><div class="ph">Firme aquí con el dedo</div></div><button class="mini lnk" style="color:#2c66b8;text-decoration:none" id="borrarU">Borrar firma</button><br>' +
        '<button class="lnk" id="noFirma">El usuario no quiso firmar</button>';
    } else {
      h = '<div class="aviso r">Se dejará constancia de que el usuario no firmó, con tu ubicación y la hora.</div><div class="grupo"><h4>Motivo</h4><div class="chips">' + j.negativa.map(function (v) { return '<button class="chip' + (A.negativa.motivo === v ? ' on' : '') + '" data-neg="' + esc(v) + '">' + esc(v) + '</button>'; }).join('') + '</div></div>' +
        '<textarea class="inp" id="negNota" rows="2" placeholder="Detalle (opcional)">' + esc(A.negativa.nota || '') + '</textarea>' +
        '<div class="fotob' + (A.nEvid ? ' ok' : '') + '" data-foto="evidencia"><span style="font-size:28px">📷</span><div><b>Foto de evidencia del trabajo terminado</b><br><small>Obligatoria</small></div><span class="n">' + A.nEvid + '</span></div>' +
        '<button class="lnk" style="color:#2c66b8" id="siFirma">Volver: el usuario sí va a firmar</button>';
    }
  } else {
    h = '<p style="font-size:13px;color:#6b7590;margin-bottom:10px">Firma para cerrar el servicio. Se generará el formato de calidad en PDF.</p><div class="pad"><canvas id="padT"></canvas><div class="ph">Tu firma</div></div><button class="mini lnk" style="color:#2c66b8;text-decoration:none" id="borrarT">Borrar firma</button>';
  }
  $('aBody').innerHTML = h; $('aBody').scrollTop = 0;
  if ($('padU')) A.pads.u = pad($('padU'), A.pads.u); if ($('padT')) A.pads.t = pad($('padT'), A.pads.t);
  if ($('borrarU')) $('borrarU').onclick = function () { A.pads.u.limpiar(); };
  if ($('borrarT')) $('borrarT').onclick = function () { A.pads.t.limpiar(); };
  if ($('noFirma')) $('noFirma').onclick = function () { guardarU(); A.negativa = { motivo: '', nota: '' }; pasoActa(); };
  if ($('siFirma')) $('siFirma').onclick = function () { A.negativa = null; pasoActa(); };
}
function pad(cv, prev) {
  var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, x = cv.getContext('2d'), dib = false, o = { firmado: false };
  cv.width = r.width * dpr; cv.height = r.height * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); x.lineWidth = 2.6; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#0d2a6b';
  if (prev && prev.firmado) { var im = new Image(); im.onload = function () { x.drawImage(im, 0, 0, r.width, r.height); }; im.src = prev.png(); o.firmado = true; }
  function p(e) { var b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
  cv.addEventListener('pointerdown', function (e) { dib = true; cv.setPointerCapture(e.pointerId); var q = p(e); x.beginPath(); x.moveTo(q.x, q.y); });
  cv.addEventListener('pointermove', function (e) { if (!dib) return; var q = p(e); x.lineTo(q.x, q.y); x.stroke(); o.firmado = true; });
  cv.addEventListener('pointerup', function () { dib = false; });
  o.limpiar = function () { x.clearRect(0, 0, cv.width, cv.height); o.firmado = false; };
  o.png = function () { var c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; var y = c.getContext('2d'); y.fillStyle = '#fff'; y.fillRect(0, 0, c.width, c.height); y.drawImage(cv, 0, 0); return c.toDataURL('image/png'); };
  return o;
}
function guardarU() { if ($('uNom')) { A.uNom = $('uNom').value.trim(); A.uCed = $('uCed').value.trim(); } if ($('aNota')) A.nota = $('aNota').value.trim(); if ($('negNota') && A.negativa) A.negativa.nota = $('negNota').value.trim(); }
$('aBody').addEventListener('click', function (e) {
  var c = e.target.closest('.chip[data-k]'); if (c) { var k = c.getAttribute('data-k'), v = c.getAttribute('data-v'), i = A.sel[k].indexOf(v); if (i >= 0) A.sel[k].splice(i, 1); else A.sel[k].push(v); c.classList.toggle('on'); return; }
  var ev = e.target.closest('[data-e]'); if (ev) { A.ev[ev.getAttribute('data-e')] = ev.getAttribute('data-v'); Array.prototype.forEach.call(ev.parentNode.children, function (b) { b.classList.toggle('on', b === ev); }); return; }
  var ng = e.target.closest('[data-neg]'); if (ng) { A.negativa.motivo = ng.getAttribute('data-neg'); Array.prototype.forEach.call(ng.parentNode.children, function (b) { b.classList.toggle('on', b === ng); }); return; }
  var f = e.target.closest('[data-foto]'); if (f) { A.tipoFoto = f.getAttribute('data-foto'); guardarU(); $('aFile').value = ''; $('aFile').click(); }
});
$('aFile').onchange = function () {
  var file = this.files && this.files[0]; if (!file || !A) return;
  carga(true, 'Subiendo foto…');
  var u = URL.createObjectURL(file), im = new Image();
  im.onload = function () {
    var s = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    api({ accion: 'fotoServicio', oferta: A.id, tipo: A.tipoFoto, foto: c.toDataURL('image/jpeg', 0.8) }).then(function (j) {
      carga(false); if (!j.ok) { toast(j.error); return; }
      if (A.tipoFoto === 'antes') A.nAntes = j.total; else if (A.tipoFoto === 'despues') A.nDesp = j.total; else A.nEvid = j.total;
      toast('Foto guardada ✔'); pasoActa();
    }).catch(function () { carga(false); toast('No se pudo subir. Revisa tu señal e inténtalo de nuevo.'); });
  };
  im.src = u;
};
$('aAtras').onclick = function () { guardarU(); if (A.paso) { A.paso--; pasoActa(); } };
$('aSig').onclick = function () {
  guardarU();
  if (A.paso === 0 && (!A.nAntes || !A.nDesp)) return toast('Sube al menos una foto de antes y una de después.');
  if (A.paso === 1 && (!A.sel.diagnostico.length || !A.sel.trabajo.length)) return toast('Marca el diagnóstico y el trabajo realizado.');
  if (A.paso === 2) {
    if (A.negativa) { if (!A.negativa.motivo) return toast('Elige el motivo.'); if (!A.nEvid) return toast('Toma la foto de evidencia.'); }
    else {
      if (!A.uNom || (A.uCed || '').replace(/\D/g, '').length < 5) return toast('Escribe el nombre y la cédula del usuario.');
      if (!A.ev.tiempo || !A.ev.resultado || !A.ev.presentacion || !A.ev.seguridad) return toast('El usuario debe completar la evaluación.');
      if (!A.pads.u || !A.pads.u.firmado) return toast('Falta la firma del usuario.');
      A.firmaU = A.pads.u.png();
    }
  }
  if (A.paso < 3) { A.paso++; pasoActa(); return; }
  if (!A.pads.t || !A.pads.t.firmado) return toast('Falta tu firma.');
  var b = { accion: 'actaServicio', oferta: A.id, nota: A.nota || '', firmaTecnico: A.pads.t.png() };
  Object.keys(A.sel).forEach(function (k) { b[k] = A.sel[k]; });
  if (A.negativa) b.negativa = A.negativa; else { b.usuarioNombre = A.uNom; b.usuarioCedula = A.uCed; b.evaluacion = A.ev; b.firmaUsuario = A.firmaU; }
  carga(true, 'Generando el formato de calidad…');
  geo().then(function (g) { b.geo = g; return api(b); }).then(function (j) {
    carga(false); if (!j.ok) { toast(j.error); return; }
    cerrarActa(); toast('¡Servicio terminado! Formato Nº ' + j.numero + ' enviado a M Clean.'); cargar();
  }).catch(function () { carga(false); toast('No se pudo enviar. Revisa tu señal e inténtalo de nuevo.'); });
};

$('rec').onclick = function () { cargar(); };
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && TOKEN) cargar(); });
if (!TOKEN) $('app').innerHTML = '<div class="vacio"><div class="ic">🔑</div>Abre el enlace personal que te enviamos por correo al aprobar tu registro.</div>'; else cargar();
</script>
