<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16285a">
<title>Técnicos M Clean</title>
<link rel="manifest" href="manifest-tecnico.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Técnicos M Clean">
<link rel="icon" href="icon-tec-192.png">
<link rel="apple-touch-icon" href="icon-tec-180.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#16285a;--yel:#f6d046;--blue:#2c66b8;--bg:#f3f5fa;--line:#e3e8f2;--txt:#1b2540;--mut:#6b7590;--ok:#1f9d63;--err:#c0392b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
header{background:var(--navy);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.hrow img{height:34px;background:#fff;border-radius:10px;padding:3px 6px}
.hrow div{flex:1}.hrow b{display:block;font-size:15px}.hrow small{font-size:11px;opacity:.75}
.ib{background:rgba(255,255,255,.12);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer}
.tabs{display:flex;max-width:560px;margin:12px auto 0}
.tabs button{flex:1;background:none;border:0;color:rgba(255,255,255,.65);font:600 14px Poppins;padding:10px 0 12px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:#fff;border-bottom-color:var(--yel)}
.tabs em{font-style:normal;background:var(--yel);color:var(--navy);border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px}
main{max-width:560px;margin:0 auto;padding:16px 16px 90px}
.aviso{background:#fff6d6;color:#7a5b00;border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:14px}
.aviso.r{background:#fde8e6;color:var(--err)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{font-size:16px;color:var(--navy);line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);margin:8px 0 12px}
.pago{font-size:22px;font-weight:800;color:var(--ok)}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:13px;font:800 15px Poppins;cursor:pointer;text-align:center;text-decoration:none;display:block;width:100%}
.b1{background:var(--yel);color:var(--navy)}.b2{background:var(--navy);color:#fff}.b3{background:#fff;color:var(--navy);border:1.5px solid var(--line)}.b4{background:var(--ok);color:#fff}
.btn:disabled{opacity:.45}
.vacio{text-align:center;color:var(--mut);padding:40px 10px;font-size:14px}
.vacio .ic{font-size:44px;margin-bottom:8px}
.fila{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.fila b{flex:0 0 96px;color:var(--mut);font-weight:500}
.pasos{display:flex;gap:6px;margin:12px 0}
.pasos span{flex:1;text-align:center;font-size:11px;font-weight:700;padding:7px 2px;border-radius:10px;background:var(--bg);color:var(--mut)}
.pasos span.ok{background:#e2f6ec;color:var(--ok)}
.dia{font-size:13px;font-weight:700;color:var(--navy);margin:14px 2px 8px;text-transform:capitalize}
.modal{position:fixed;inset:0;background:rgba(10,18,40,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.hoja{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 26px}
.hoja h2{font-size:18px;color:var(--navy);margin-bottom:6px}
.decl{background:var(--bg);border-radius:14px;padding:12px;font-size:12.5px;line-height:1.55;margin:10px 0;text-align:justify}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:8px 0 14px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--navy)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:14px Poppins;margin:8px 0 12px}
.carga{position:fixed;inset:0;background:rgba(22,40,90,.8);color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:60;font-weight:600}
.carga.on{display:flex}
.spin{width:42px;height:42px;border:5px solid rgba(255,255,255,.25);border-top-color:var(--yel);border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.toast{position:fixed;left:16px;right:16px;bottom:20px;max-width:528px;margin:0 auto;background:var(--navy);color:#fff;border-radius:14px;padding:13px 16px;font-size:14px;z-index:70;display:none}
.toast.on{display:block}
.full{position:fixed;inset:0;background:var(--bg);z-index:55;display:none;flex-direction:column}
.full.on{display:flex}
.fhead{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.fhead b{flex:1;font-size:15px}.fhead small{display:block;font-size:11px;opacity:.75;font-weight:500}
.fbody{flex:1;overflow:auto;padding:16px;max-width:560px;width:100%;margin:0 auto}
.fpie{background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.fpie div{max-width:560px;margin:0 auto;display:flex;gap:10px}.fpie .b3{flex:0 0 34%}
.grupo{margin-bottom:14px}.grupo h4{font-size:13px;color:var(--navy);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:600 12.5px Poppins;cursor:pointer;color:var(--txt)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.fotob{display:flex;align-items:center;gap:12px;background:#fff;border:2px dashed #c8d2e6;border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.fotob .n{margin-left:auto;background:var(--navy);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.fotob.ok{border-style:solid;border-color:var(--ok)}
.b5{background:#fde8e6;color:var(--err);border:1.5px solid #f3b8b0}
.chk{display:flex;gap:10px;align-items:flex-start;background:#f3f6fb;border-radius:12px;padding:12px;margin-bottom:8px;font-size:14px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:#16285a}
.man{background:linear-gradient(135deg,#16285a,#2c66b8);color:#fff;border-radius:18px;padding:16px;margin-bottom:14px}
.man h3{color:#fff;font-size:16px}.man p{font-size:13px;opacity:.9;margin:6px 0 12px}
.man .acc a{background:rgba(255,255,255,.14);color:#fff;border:0}
.mot{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font:600 14px Poppins;color:var(--navy);cursor:pointer}
.mot.on{border-color:var(--err);background:#fde8e6}
.ev{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.ev .o{display:flex;gap:6px}.ev .o button{width:36px;height:36px;border-radius:50%;border:1.5px solid #e07a2e;background:#fff;color:#e07a2e;font:800 13px Poppins;cursor:pointer}
.ev .o button.on{background:#e07a2e;color:#fff}
.pad{background:#fff;border:1.5px solid var(--line);border-radius:14px;position:relative;touch-action:none;margin-bottom:6px}
.pad canvas{width:100%;height:160px;display:block}
.pad .ph{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:11px;color:var(--mut);pointer-events:none}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px;font:14px Poppins;margin-bottom:8px}
.lnk{background:none;border:0;color:var(--err);font:700 13px Poppins;cursor:pointer;padding:8px 0;text-decoration:underline}
.wa{position:fixed;right:16px;bottom:18px;width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:30}
</style>
</head>
<body>
<header>
  <div class="hrow"><img src="logo-dark.webp" alt="M Clean"><div><b id="nom">Técnico aliado</b><small id="zona">M Clean</small></div><button class="ib" id="rec" title="Actualizar">⟳</button></div>
  <div class="tabs"><button class="on" data-t="ofertas">Ofertas <em id="nOf">0</em></button><button data-t="agenda">Mi agenda <em id="nAg">0</em></button><button data-t="carnet">Carnet</button></div>
</header>
<main id="app"><div class="vacio">Cargando…</div></main>
<a class="wa" href="https://wa.me/573226895212" title="Escribir a M Clean">💬</a>
<div class="modal" id="modal"><div class="hoja" id="hoja"></div></div>
<div class="carga" id="carga"><div class="spin"></div><div id="cargaTxt">Un momento…</div></div>
<div class="toast" id="toast"></div>
<div class="full" id="acta"><div class="fhead"><b id="aTit">Acta del servicio<small id="aSub"></small></b><button class="ib" id="aCerrar">✕</button></div><div class="fbody" id="aBody"></div><div class="fpie"><div><button class="btn b3" id="aAtras">Atrás</button><button class="btn b1" id="aSig">Siguiente</button></div></div></div>
<input type="file" id="aFile" accept="image/*" capture="environment" style="display:none">
<script>
var API = 'https://script.google.com/macros/s/AKfycbwmj3prBAsOb77b5QTqPoY673GXdsZhBn0ef_ZaqDuX-9xzFoMCJFAs3Nq2tOeFoz2N/exec';
var st = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
var TOKEN = (location.hash.match(/t=([^&]+)/) || [])[1] || st.get('mc_tec') || '';
if (TOKEN) st.set('mc_tec', TOKEN);
var D = null, TAB = 'ofertas', watchId = null;
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function api(b) { b.t = TOKEN; return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(b) }).then(function (r) { return r.json(); }); }
function carga(on, t) { $('carga').classList.toggle('on', !!on); if (t) $('cargaTxt').textContent = t; }
function toast(t) { var x = $('toast'); x.textContent = t; x.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { x.classList.remove('on'); }, 4000); }
function pesos(n) { return n ? '$' + Number(n).toLocaleString('es-CO') : 'Valor por confirmar'; }
function fechaTxt(f) { var p = String(f).split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return d.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' }); }
function hora12(h) { if (!h) return ''; var p = h.split(':'), H = +p[0], M = p[1]; return (H % 12 || 12) + ':' + M + (H >= 12 ? ' p. m.' : ' a. m.'); }
function geo() { return new Promise(function (res) { if (!navigator.geolocation) return res(null); var t = setTimeout(function () { res(null); }, 12000); navigator.geolocation.getCurrentPosition(function (p) { clearTimeout(t); res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }); }, function () { clearTimeout(t); res(null); }, { enableHighAccuracy: true, timeout: 11000, maximumAge: 10000 }); }); }

function cargar() {
  return api({ accion: 'portalTecnico' }).then(function (j) {
    if (!j.ok) { $('app').innerHTML = '<div class="vacio"><div class="ic">🔒</div>' + esc(j.error) + '</div>'; return; }
    D = j; $('nom').textContent = j.perfil.nombre; $('zona').textContent = 'Zona ' + j.perfil.zona;
    $('nOf').textContent = j.ofertas.length; $('nAg').textContent = j.servicios.length;
    pintar(); seguir();
  }).catch(function () { $('app').innerHTML = '<div class="vacio"><div class="ic">📶</div>Sin conexión. Revisa tu internet.</div>'; });
}
function pintar() {
  var p = D.perfil, h = '';
  if (p.motivo) h += '<div class="aviso' + (p.estado === 'Suspendido' ? ' r' : '') + '">' + esc(p.motivo) + '</div>';
  if (p.rutPendiente) h += '<div class="aviso">📄 Falta tu RUT. Súbelo desde la pestaña <b>Carnet</b>.</div>';
  if (p.manual && !p.manual.confirmado && TAB !== 'carnet') h += '<div class="man"><h3>📘 Tu capacitación</h3><p>Lee el manual del técnico y mira el video de 90 segundos. Luego confirma con “Leí y entendí”' + (p.manual.enviado ? '. <b>Hasta confirmar no recibes servicios.</b>' : '.') + '</p><div class="acc" style="margin-bottom:10px"><a class="btn" target="_blank" rel="noopener" href="' + p.manual.pdf + '">📄 Manual</a><a class="btn" target="_blank" rel="noopener" href="' + p.manual.video + '">🎬 Video</a></div><button class="btn b1" onclick="abrirManual()">Leí y entendí</button></div>';
  if (TAB === 'ofertas') {
    if (!D.ofertas.length) h += '<div class="vacio"><div class="ic">📭</div>No hay ofertas en tu zona en este momento.<br>Te avisaremos por correo cuando llegue una.</div>';
    D.ofertas.forEach(function (o) {
      h += '<div class="card"><h3>' + esc(o.tipo) + '</h3><div class="meta"><span>📍 ' + esc(o.ciudad) + '</span><span>📅 ' + esc(fechaTxt(o.fecha)) + '</span>' + (o.hora ? '<span>🕐 ' + hora12(o.hora) + '</span>' : '') + '</div>' +
        '<div class="pago">' + pesos(o.pago) + '</div><p style="font-size:12px;color:#6b7590;margin:4px 0 12px">Eres libre de aceptar o rechazar. Lo toma el primero que acepte.</p>' +
        '<div class="acc"><button class="btn b3" data-rech="' + o.id + '">No puedo</button><button class="btn b1" data-acep="' + o.id + '"' + (p.puedeAceptar ? '' : ' disabled') + '>Aceptar</button></div></div>';
    });
  } else if (TAB === 'agenda') {
    if (!D.servicios.length) h += '<div class="vacio"><div class="ic">🗓️</div>No tienes servicios aceptados.</div>';
    var ult = '';
    D.servicios.forEach(function (s) {
      if (s.fecha !== ult) { h += '<div class="dia">' + esc(fechaTxt(s.fecha)) + '</div>'; ult = s.fecha; }
      var dest = s.lat ? s.lat + ',' + s.lng : encodeURIComponent(s.direccion + ', ' + s.ciudad + ', Colombia');
      h += '<div class="card"><h3>' + (s.hora ? hora12(s.hora) + ' · ' : '') + esc(s.tipo) + '</h3>' +
        '<div class="fila"><b>Usuario</b><span>' + esc(s.cliente || '—') + '</span></div>' +
        '<div class="fila"><b>Dirección</b><span>' + esc(s.direccion || '—') + ', ' + esc(s.ciudad) + '</span></div>' +
        (s.exp ? '<div class="fila"><b>Expediente</b><span>' + esc(s.exp) + '</span></div>' : '') +
        (s.detalle ? '<div class="fila"><b>Detalle</b><span>' + esc(s.detalle) + '</span></div>' : '') +
        '<div class="fila"><b>Pago</b><span style="color:#1f9d63;font-weight:700">' + pesos(s.pago) + '</span></div>' +
        '<div class="pasos"><span class="' + (s.salida ? 'ok' : '') + '">🚗 Salida' + (s.salida ? ' ' + s.salida.slice(11, 16) : '') + '</span><span class="' + (s.llegada ? 'ok' : '') + '">📍 Llegada' + (s.llegada ? ' ' + s.llegada.slice(11, 16) : '') + '</span><span class="' + (s.terminado ? 'ok' : '') + '">✅ Fin' + (s.terminado ? ' ' + s.terminado.slice(11, 16) : '') + '</span></div>' +
        '<div class="acc" style="margin-bottom:10px"><a class="btn b3" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=' + dest + '&travelmode=driving">🗺️ Google Maps</a><a class="btn b3" target="_blank" href="https://waze.com/ul?' + (s.lat ? 'll=' + s.lat + ',' + s.lng : 'q=' + encodeURIComponent(s.direccion + ', ' + s.ciudad)) + '&navigate=yes">🚙 Waze</a></div>' +
        (s.seguimiento && s.salida && !s.llegada ? '<a class="btn b3" style="margin-bottom:10px" target="_blank" rel="noopener" href="' + esc(s.seguimiento) + '">📡 Abrir seguimiento del cliente</a>' : '') +
        (s.noIngreso ? '<div class="aviso r">🚫 Reportaste que no pudiste ingresar (' + esc(s.noIngreso.slice(11, 16)) + '). Espera instrucciones de M Clean.</div>' :
        !s.salida ? '<button class="btn b2" data-salir="' + s.id + '"' + (s.puedeSalir ? '' : ' disabled') + '>🚗 Salgo hacia el servicio</button>' + (s.puedeSalir ? '' : '<p style="font-size:12px;color:#6b7590;text-align:center;margin-top:6px">Disponible desde una hora antes del servicio</p>') :
          !s.llegada ? '<button class="btn b1" data-ev="llegada" data-id="' + s.id + '">📍 Llegué al sitio</button>' :
            !s.terminado ? '<button class="btn b4" data-acta="' + s.id + '">📝 Completar acta y terminar</button>' : '<p style="text-align:center;color:#1f9d63;font-weight:700">Servicio terminado ✔</p>') +
        (s.salida && !s.terminado && !s.noIngreso ? '<button class="btn b5" style="margin-top:10px" data-noing="' + s.id + '">🚫 No puedo ingresar</button>' : '') + '</div>';
    });
  } else {
    h += '<div class="card" id="misPagos"><h3>💵 Mis pagos</h3><p style="font-size:13px;color:#6b7590;margin-top:6px">Cargando…</p></div>';
    var EMP = p.tipo === 'Empresa';
    h += (EMP ? '' : '<div class="card" style="text-align:center"><h3>Mi carnet</h3><p style="font-size:13px;color:#6b7590;margin:6px 0 14px">Tu carnet con foto, QR y sello de M Clean.</p><a class="btn b1" href="carnet.html#t=' + TOKEN + '">Abrir mi carnet</a></div>') +
      '<div class="card" style="text-align:center"><h3>' + (EMP ? 'Acuerdo de la empresa' : 'Mi contrato') + '</h3><p style="font-size:13px;color:#6b7590;margin:6px 0 14px">' + (EMP ? 'El acuerdo de prestación de servicios firmado' : 'Tu contrato de prestación de servicios firmado') + ', en PDF con el membrete de M Clean.</p><button class="btn b3" onclick="verContrato(this)">Descargar ' + (EMP ? 'el acuerdo' : 'mi contrato') + '</button></div>' +
      (p.manual ? '<div class="card"><h3>📘 Capacitación</h3><p style="font-size:13px;color:#6b7590;margin:6px 0 12px">' + (p.manual.confirmado ? 'Confirmada el ' + esc(p.manual.confirmado) + ' ✔' : 'Pendiente de confirmar.') + '</p><div class="acc"><a class="btn b3" target="_blank" rel="noopener" href="' + p.manual.pdf + '">📄 Manual</a><a class="btn b3" target="_blank" rel="noopener" href="' + p.manual.video + '">🎬 Video</a></div>' + (p.manual.confirmado ? '' : '<button class="btn b1" style="margin-top:10px" onclick="abrirManual()">Leí y entendí</button>') + '</div>' : '') +
      '<div class="card"><h3>¿Cómo funciona?</h3><p style="font-size:13px;color:#6b7590;margin-top:6px;line-height:1.6">1. Te llegan ofertas de tu zona; aceptas solo las que quieras.<br>2. El día del servicio toca <b>Salgo</b> (desde 1 hora antes), activa el seguimiento si lo trae, toca <b>Llegué</b> y completa el acta.<br>3. Toma las fotos desde la app: llevan marca de agua automática.<br>4. Si te atiende un menor o un adulto mayor con discapacidad, no ingreses: toca <b>No puedo ingresar</b>.<br>5. Tu ubicación solo se registra durante el servicio aceptado.<br>6. Se te paga por cada servicio aprobado.</p></div>';
  }
  $('app').innerHTML = h;
  if ($('misPagos')) cargarPagos();
}
function verContrato(b) { b.disabled = true; b.textContent = 'Preparando…';
  api({ accion: 'miContrato' }).then(function (j) { b.disabled = false; b.textContent = 'Descargar mi contrato';
    if (!j.ok || !j.pdf) { toast(j.error || 'No disponible'); return; }
    var bin = atob(j.pdf.split(',')[1]), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([u], { type: 'application/pdf' })), a = document.createElement('a'); a.href = url; a.download = j.nombre || 'Contrato.pdf'; document.body.appendChild(a); a.click(); a.remove();
  }).catch(function (e) { b.disabled = false; b.textContent = 'Descargar mi contrato'; toast(e.message); }); }
document.addEventListener('click', function (e) {
  var t = e.target.closest('.tabs button'); if (t) { TAB = t.getAttribute('data-t'); Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.classList.toggle('on', b === t); }); pintar(); window.scrollTo(0, 0); return; }

    por.forEach(function (c) { var fac = c.estado === 'Por facturar'; h += '<div style="margin-top:12px;border:2px solid #f6d046;border-radius:14px;padding:12px"><b>🧾 ' + (fac ? 'Liquidación para facturar ' : 'Cuenta de cobro ') + esc(c.id) + '</b><br><span style="font-size:13px">' + c.servicios + ' servicio(s) · ' + esc(c.desde) + ' a ' + esc(c.hasta) + ' · <b>' + pesos(c.total) + '</b></span>' +
      (fac ? '<p style="font-size:12px;color:#6b7590;margin:8px 0 0">Expidan la factura electrónica a nombre de M Clean Desinfección y Limpieza S.A.S., NIT 901.380.963-5, por ese valor.</p><button class="btn b1" style="margin-top:10px" onclick="subirFactura(\'' + c.id + '\')">Subir factura (PDF o foto)</button>' : '<button class="btn b1" style="margin-top:10px" onclick="verCuenta(\'' + c.id + '\')">Revisar y firmar</button>') + '</div>'; });
    if (j.servicios.length) h += '<p style="font-size:13px;font-weight:700;margin:12px 0 4px">Servicios</p>' + j.servicios.map(function (s) { return '<div style="display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid #eef1f6;padding:6px 0"><span>' + esc(s.fecha) + ' · ' + esc(s.ciudad) + (s.exp ? ' · Exp. ' + esc(s.exp) : '') + '<br><span style="color:#6b7590">' + esc(s.estado) + '</span></span><b>' + pesos(s.valor) + '</b></div>'; }).join('');
    var hist = j.cuentas.filter(function (c) { return c.estado !== 'Por firmar'; });
    if (hist.length) h += '<p style="font-size:13px;font-weight:700;margin:12px 0 4px">Cuentas de cobro</p>' + hist.map(function (c) { return '<div style="display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid #eef1f6;padding:6px 0"><span>' + esc(c.id) + '<br><span style="color:#6b7590">' + esc(c.estado) + '</span></span><b>' + pesos(c.total) + '</b></div>'; }).join('');
    $('misPagos').innerHTML = h;
  });
}
function verCuenta(id) {
  var c = PAGOS.cuentas.filter(function (x) { return x.id === id; })[0]; if (!c) return;
  $('hoja').innerHTML = '<h2>Cuenta de cobro ' + esc(c.id) + '</h2><p style="font-size:13px;color:#6b7590">M Clean Desinfección y Limpieza S.A.S. te debe <b>' + pesos(c.total) + '</b> por estos servicios:</p>' +
    c.detalle.map(function (s) { return '<div style="display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid #eef1f6;padding:6px 0"><span>' + esc(s.fecha) + ' · ' + esc(s.tipo) + '<br><span style="color:#6b7590">' + esc(s.ciudad) + (s.exp ? ' · Exp. ' + esc(s.exp) : '') + '</span></span><b>' + pesos(s.valor) + '</b></div>'; }).join('') +
    '<p style="font-size:12px;color:#6b7590;margin-top:8px">Pago a: ' + esc(PAGOS.banco.banco || '—') + ' ' + esc(PAGOS.banco.tipo || '') + ' ' + esc(PAGOS.banco.cuenta || '') + '. Al firmar declaras que prestaste estos servicios de forma independiente.</p>' +
    '<p style="font-size:13px;font-weight:700;margin-top:10px">Firma con tu dedo</p><canvas id="ccPad" style="width:100%;height:150px;border:2px dashed #cfd6e4;border-radius:14px;touch-action:none;background:#fff"></canvas>' +
    '<div class="acc"><button class="btn b3" id="ccBorrar">Borrar</button><button class="btn b1" id="ccFirmar">Firmar y enviar</button></div><button class="btn b3" style="margin-top:8px" onclick="cerrar()">Cerrar</button>';
  $('modal').classList.add('on');
  var pad = $('ccPad'), ctx, dib = false, firmo = false;
  setTimeout(function () { var r = pad.getBoundingClientRect(), k = window.devicePixelRatio || 1; pad.width = r.width * k; pad.height = r.height * k; ctx = pad.getContext('2d'); ctx.scale(k, k); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = '#0D2C54'; }, 60);
  var pos = function (e) { var r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  pad.addEventListener('pointerdown', function (e) { dib = true; var p = pos(e); ctx.beginPath(); ctx.moveTo(p[0], p[1]); });
  pad.addEventListener('pointermove', function (e) { if (!dib) return; var p = pos(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); firmo = true; });
  pad.addEventListener('pointerup', function () { dib = false; });
  $('ccBorrar').onclick = function () { ctx.clearRect(0, 0, pad.width, pad.height); firmo = false; };
  $('ccFirmar').onclick = function () {
    if (!firmo) { toast('Firma con tu dedo en el recuadro.'); return; }
    var c2 = document.createElement('canvas'); c2.width = pad.width; c2.height = pad.height; var x = c2.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c2.width, c2.height); x.drawImage(pad, 0, 0);
    carga(true, 'Generando tu cuenta de cobro…');
    api({ accion: 'firmarCuenta', cuenta: c.id, firma: c2.toDataURL('image/png') }).then(function (j) { carga(false); if (!j.ok) { toast(j.error); return; } cerrar(); toast('✓ Cuenta de cobro firmada y enviada a M Clean'); cargarPagos(); })
      .catch(function (e) { carga(false); toast(e.message); });
  };
}

/* ======== Protocolo: marca de agua, salida, no ingreso, capacitación ======== */
var LOGO = new Image(); LOGO.src = 'logo-dark.webp';
function marcaAgua(c, g) {
  var x = c.getContext('2d'), w = c.width, h = c.height, f = Math.max(14, Math.round(w / 42)), pad = Math.round(f * 0.7), bh = f * 3.4;
  var sv = D && A ? D.servicios.filter(function (s) { return s.id === A.id; })[0] : null, ahora = new Date();
  var etq = { antes: 'ANTES', despues: 'DESPUÉS', evidencia: 'EVIDENCIA' }[A.tipoFoto] || '';
  var l1 = 'M Clean · ' + etq + (sv && sv.exp ? ' · Exp. ' + sv.exp : '') + (sv ? ' · ' + sv.ciudad : '');
  var l2 = ahora.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + ahora.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }) + (g ? ' · ' + g.lat.toFixed(5) + ', ' + g.lng.toFixed(5) + ' (±' + Math.round(g.acc || 0) + ' m)' : ' · sin GPS');
  x.fillStyle = 'rgba(22,40,90,.72)'; x.fillRect(0, h - bh, w, bh);
  x.fillStyle = '#f6d046'; x.fillRect(0, h - bh, w, Math.max(2, f / 6));
  var lx = pad; try { if (LOGO.complete && LOGO.naturalWidth) { var lh = bh - pad * 1.4, lw = lh * LOGO.naturalWidth / LOGO.naturalHeight; x.fillStyle = '#fff'; x.fillRect(pad * .6, h - bh + pad * .7, lw + pad * .8, lh); x.drawImage(LOGO, pad, h - bh + pad * .7, lw, lh); lx = pad * 2 + lw; } } catch (e) { }
  x.fillStyle = '#fff'; x.font = '700 ' + f + 'px Poppins, sans-serif'; x.textBaseline = 'top'; x.fillText(l1, lx, h - bh + pad * .8);
  x.font = '500 ' + Math.round(f * .85) + 'px Poppins, sans-serif'; x.fillStyle = '#dbe3f3'; x.fillText(l2, lx, h - bh + pad * .8 + f * 1.35);
}
function checklistSalida(id) {
  $('hoja').innerHTML = '<h2>Antes de salir</h2><p style="font-size:14px;color:#6b7590;margin-bottom:12px">Confirma que vas completo al servicio:</p>' +
    '<label class="chk"><input type="checkbox" class="ck"> Llevo las herramientas e implementos del servicio</label>' +
    '<label class="chk"><input type="checkbox" class="ck"> Llevo los elementos de limpieza básicos</label>' +
    '<label class="chk"><input type="checkbox" class="ck"> Tengo la ubicación del celular activada y batería suficiente</label>' +
    '<div class="acc"><button class="btn b3" onclick="cerrar()">Volver</button><button class="btn b2" id="ckOk">Salgo ahora</button></div>';
  $('modal').classList.add('on');
  $('ckOk').onclick = function () { var ok = Array.prototype.every.call(document.querySelectorAll('.ck'), function (c) { return c.checked; });
    if (!ok) { toast('Marca las tres casillas para continuar.'); return; } cerrar(); evento('salida', id, false, '', { checklist: true }); };
}
function noIngreso(id) {
  var MOT = ['Me atiende un menor de edad', 'Me atiende un adulto mayor con discapacidad', 'No hay un adulto responsable', 'Otro motivo'], sel = '';
  $('hoja').innerHTML = '<h2>🚫 No puedo ingresar</h2><p style="font-size:14px;color:#6b7590;margin-bottom:12px">Por ningún motivo ingreses si te atiende un menor de edad o un adulto mayor con discapacidad sin un adulto responsable. Elige el motivo: M Clean reprograma la visita.</p>' +
    MOT.map(function (m) { return '<button class="mot" data-m="' + esc(m) + '">' + esc(m) + '</button>'; }).join('') +
    '<textarea id="niNota" rows="2" placeholder="Detalle (opcional)"></textarea><div class="acc"><button class="btn b3" onclick="cerrar()">Volver</button><button class="btn b5" id="niOk">Reportar</button></div>';
  $('modal').classList.add('on');
  Array.prototype.forEach.call(document.querySelectorAll('.mot'), function (b) { b.onclick = function () { sel = b.getAttribute('data-m'); Array.prototype.forEach.call(document.querySelectorAll('.mot'), function (y) { y.classList.toggle('on', y === b); }); }; });
  $('niOk').onclick = function () { if (!sel) { toast('Elige el motivo.'); return; } carga(true, 'Reportando…');
    geo().then(function (g) { return api({ accion: 'eventoServicio', oferta: id, evento: 'noIngreso', motivo: sel, nota: $('niNota').value.trim(), geo: g || {} }); })
      .then(function (j) { carga(false); if (!j.ok) { toast(j.error); return; } cerrar(); toast('Reportado. M Clean te dará instrucciones.'); cargar(); })
      .catch(function () { carga(false); toast('No se pudo reportar. Revisa tu señal.'); }); };
}
function abrirManual() {
  var m = D && D.perfil.manual; if (!m) return;
  api({ accion: 'manualVisto' });
  $('hoja').innerHTML = '<h2>📘 Capacitación del técnico</h2><p style="font-size:14px;color:#6b7590;margin-bottom:12px">Lee el manual completo y mira el video con el proceso del servicio en la app.</p>' +
    '<div class="acc" style="margin-bottom:12px"><a class="btn b3" target="_blank" rel="noopener" href="' + m.pdf + '">📄 Manual (PDF)</a><a class="btn b3" target="_blank" rel="noopener" href="' + m.video + '">🎬 Video</a></div>' +
    '<label class="chk"><input type="checkbox" id="manOk"> Leí el manual del técnico, vi el video de capacitación y me comprometo a seguir el protocolo de servicio de M Clean.</label>' +
    '<div class="acc"><button class="btn b3" onclick="cerrar()">Después</button><button class="btn b1" id="manBtn">Leí y entendí</button></div>';
  $('modal').classList.add('on');
  $('manBtn').onclick = function () { if (!$('manOk').checked) { toast('Marca la casilla para confirmar.'); return; } carga(true, 'Registrando…');
    api({ accion: 'manualConfirmar', acepto: true, ua: navigator.userAgent }).then(function (j) { carga(false); if (!j.ok) { toast(j.error); return; } cerrar(); toast('✓ Capacitación confirmada. ¡Bienvenido!'); cargar(); })
      .catch(function () { carga(false); toast('Sin conexión. Inténtalo de nuevo.'); }); };
}
if (/manual=1/.test(location.hash)) { var _iv = setInterval(function () { if (D) { clearInterval(_iv); if (D.perfil.manual && !D.perfil.manual.confirmado) abrirManual(); } }, 300); setTimeout(function () { clearInterval(_iv); }, 15000); }

function subirFactura(id) {
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/pdf,image/*';
  inp.onchange = function () { var f = inp.files[0]; if (!f) return; if (f.size > 8e6) { toast('El archivo pesa más de 8 MB.'); return; }
    var r = new FileReader(); r.onload = function () { carga(true, 'Subiendo la factura…');
      api({ accion: 'subirFactura', cuenta: id, archivo: r.result }).then(function (j) { carga(false); if (!j.ok) { toast(j.error); return; } toast('✓ Factura recibida. Les avisaremos cuando hagamos el pago.'); cargarPagos(); })
        .catch(function () { carga(false); toast('No se pudo subir. Intenta de nuevo.'); }); };
    r.readAsDataURL(f); };
  inp.click();
}
